name: Remove Granny

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-granny:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove Granny
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = ",\n{id:'granny',title:'Granny',cat:'horror',tag:'Terror • Survival',cover:'https://xlad.com/thumbs/90.png',url:'https://xlad.com/iframe/c/Granny.html'}"
          if old in s:
              s = s.replace(old, '', 1)
          elif "id:'granny'" in s:
              raise SystemExit('Granny entry found but did not match expected text; stopping to avoid damaging index.html')
          else:
              print('Granny already absent')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/remove-granny.yml
          git commit -m "Remove Granny from Terror category"
          git rm .github/workflows/remove-granny.yml
          git commit -m "Remove temporary Granny removal workflow"
          git push
