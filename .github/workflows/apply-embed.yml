name: Apply PXgames embed test

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace soccer iframe
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://www.y8.com/embed/1_on_1_soccer'
          new = 'https://game316009.konggames.com/gamez/0031/6009/live/index.html'
          if old not in s:
              print('Old embed URL not found; nothing to change.')
          else:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('Embed URL replaced.')
          PY

      - name: Commit change
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Test Kong embed inside PXgames'
          git push

      - name: Remove one-shot workflow
        if: success()
        run: |
          git rm .github/workflows/apply-embed.yml || true
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Remove one-shot embed workflow'
            git push
          fi
