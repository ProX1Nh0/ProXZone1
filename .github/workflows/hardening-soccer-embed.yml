name: Harden Soccer embed

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix the soccer iframe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Use a direct iframe embed for Soccer Random.
          target = 'https://www.bubbleshooter.net/embed.php?id=1502'
          s = re.sub(
              r'https://(?:embed\.)?gamedistribution\.com/[^"\']*308d826f20034d7b972f25258c8d0a44[^"\']*',
              target,
              s,
              count=1
          )
          s = re.sub(
              r'https://html5\.gamedistribution\.com/[^"\']*308d826f20034d7b972f25258c8d0a44[^"\']*',
              target,
              s,
              count=1
          )

          # Remove restrictions that can interfere with the embedded game.
          s = re.sub(r'\n\s*sandbox="[^"]*"', '', s, count=1)
          s = re.sub(r'\n\s*allow="[^"]*"', '', s, count=1)
          s = re.sub(r'\n\s*allowfullscreen', '', s, count=1)

          # Make the direct embed interactive and fullscreen-capable.
          s = s.replace(
              'title="Soccer Random"',
              'title="Soccer Random"\n            allow="fullscreen; autoplay; gamepad"\n            allowfullscreen',
              1
          )
          s = s.replace('loading="lazy"', 'loading="eager"')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit only if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Use direct Soccer Random embed"
          git push
