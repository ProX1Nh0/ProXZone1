name: Finalize ProXZone game embed

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean and finalize the site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if '<div id="lock-screen">' in s:
              start = s.index('<div id="lock-screen">')
              end = s.index('<div id="site">', start)
              s = s[:start] + s[end:]
          s = re.sub(r'#site\{\s*opacity:0;\s*transition:opacity[^}]*\}', '#site{ opacity:1; }', s, count=1)

          marker = '/* ---------- FAKE CALCULATOR / UNLOCK ---------- */'
          if marker in s:
              start = s.index(marker)
              end = s.index('</script>', start)
              s = s[:start] + '// ProXZone opens directly into the game catalog.\n' + s[end:]

          target = 'https://www.bubbleshooter.net/embed.php?id=1502'
          patterns = [
              r'https://www\.gamepix\.com/play/soccer-skills-euro-cup\?embed=true[^"\']*',
              r'https://embed\.gamedistribution\.com/[^"\']*',
              r'https://html5\.gamedistribution\.com/[^"\']*',
              r'https://(?:www\.)?(?:pt\.)?y8\.com/[^"\']*',
          ]
          for pattern in patterns:
              s = re.sub(pattern, target, s, count=10, flags=re.I)

          lines = []
          for line in s.splitlines():
              low = line.lower()
              if 'y8.com' in low or 'gamedistribution.com' in low or 'gamepix.com/play/soccer-skills-euro-cup' in low:
                  continue
              if 'sandbox=' in low:
                  continue
              lines.append(line)
          s = '\n'.join(lines) + '\n'

          s = re.sub(r'title="Soccer Skills Euro Cup"', 'title="Soccer Random"', s, count=10)
          s = s.replace('loading="lazy"', 'loading="eager"')
          if target in s:
              s = s.replace('src="' + target + '"', 'src="' + target + '"\n            allowfullscreen', 1)

          p.write_text(s, encoding='utf-8')

          low = s.lower()
          assert 'y8.com' not in low
          assert 'gamedistribution.com' not in low
          assert 'gamepix.com/play/soccer-skills-euro-cup' not in low
          assert target in s
          assert '<div id="lock-screen">' not in s
          PY

      - name: Commit only if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Restore Soccer Random embed"
          git push
