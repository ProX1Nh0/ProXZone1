name: ProXZone UI and catalog

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch ProXZone page
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- PROXZONE-UI-PATCH -->'
          if marker in s:
              print('Patch already present; nothing to do.')
              raise SystemExit(0)

          patch = r'''\n<!-- PROXZONE-UI-PATCH -->
<style>
  .pxz-cat-photo{width:36px;height:36px;border-radius:9px;object-fit:cover;display:block;flex-shrink:0;border:1px solid rgba(255,255,255,.12)}
  .pxz-cat-photo.large{width:40px;height:40px}
  .pxz-extra-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .pxz-extra-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
  .pxz-extra-card:hover{border-color:rgba(61,139,255,.4);transform:translateY(-2px);transition:.18s}
  .pxz-extra-card h4{font-family:'Orbitron',sans-serif;font-size:15px;margin:0}
  .pxz-extra-card p{font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin:0;flex:1}
  .pxz-extra-play{border:0;border-radius:9px;padding:10px 14px;background:var(--grad);color:#07070f;font-weight:800;cursor:pointer}
  #pxz-game-modal{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.82);backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;padding:20px}
  #pxz-game-modal.open{display:flex}
  .pxz-modal-box{width:min(1100px,96vw);height:min(760px,92vh);background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .pxz-modal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:800}
  .pxz-modal-close{border:1px solid var(--line);background:var(--bg-2);color:var(--ink);border-radius:8px;padding:7px 11px;cursor:pointer}
  .pxz-modal-frame{flex:1;min-height:0;background:#000}
  .pxz-modal-frame iframe{width:100%;height:100%;border:0;display:block}
  #pxz-calculator{position:fixed;inset:0;z-index:400;background:radial-gradient(circle at 50% 20%,rgba(61,139,255,.22),transparent 45%),#07070f;display:flex;align-items:center;justify-content:center;padding:20px}
  #pxz-calculator.hide{display:none}
  .pxz-calc-box{width:min(390px,94vw);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 30px 90px rgba(0,0,0,.55)}
  .pxz-calc-brand{font-family:'Orbitron',sans-serif;text-align:center;font-size:20px;margin-bottom:4px}
  .pxz-calc-sub{text-align:center;color:var(--ink-soft);font-size:12px;margin-bottom:16px}
  .pxz-calc-display{width:100%;height:58px;background:#080912;border:1px solid var(--line);border-radius:10px;color:var(--ink);font-size:24px;text-align:right;padding:10px 12px;margin-bottom:12px;outline:none}
  .pxz-calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .pxz-calc-grid button{height:48px;border:1px solid var(--line);border-radius:9px;background:var(--bg-2);color:var(--ink);font-size:16px;font-weight:700;cursor:pointer}
  .pxz-calc-grid button:hover{background:#1a1d35}
  .pxz-calc-grid .op{color:var(--blue)}
  .pxz-calc-grid .eq{background:var(--grad);color:#07070f;border:0}
  .pxz-enter{width:100%;margin-top:12px;border:0;border-radius:10px;padding:12px;background:var(--grad);color:#07070f;font-weight:900;cursor:pointer}
  @media(max-width:700px){.pxz-extra-grid{grid-template-columns:1fr}.pxz-modal-box{height:88vh}}
</style>

<script>
(function(){
  const CAT_IMAGES = {
    'esporte':'https://commons.wikimedia.org/wiki/Special:FilePath/Soccer_ball.jpg',
    'esportes':'https://commons.wikimedia.org/wiki/Special:FilePath/Soccer_ball.jpg',
    'tabuleiro':'https://commons.wikimedia.org/wiki/Special:FilePath/Chess_board.jpg',
    'ação':'https://commons.wikimedia.org/wiki/Special:FilePath/Sports_car_(40652604980).jpg',
    'acao':'https://commons.wikimedia.org/wiki/Special:FilePath/Sports_car_(40652604980).jpg'
  };

  function iconifyCategories(){
    document.querySelectorAll('.cat-item').forEach(item=>{
      const label=(item.querySelector('.cat-text b')?.textContent||'').trim().toLowerCase();
      const src=CAT_IMAGES[label];
      if(!src) return;
      const box=item.querySelector('.cat-icon');
      if(!box || box.querySelector('.pxz-cat-photo')) return;
      box.innerHTML='';
      const img=document.createElement('img');
      img.className='pxz-cat-photo'; img.src=src; img.alt=label;
      box.appendChild(img);
    });
  }

  function replaceBrand(){
    const old=document.querySelector('.brand-logo');
    if(!old || old.dataset.pxzDone) return;
    old.dataset.pxzDone='1';
    const wrap=document.createElement('div');
    wrap.setAttribute('aria-label','ProXZone');
    wrap.style.cssText='height:42px;width:48px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 0 10px rgba(61,139,255,.35));';
    wrap.innerHTML='<svg viewBox="0 0 64 64" width="40" height="40" aria-hidden="true"><rect x="7" y="14" width="50" height="36" rx="10" fill="none" stroke="currentColor" stroke-width="5"/><path d="M18 32h10M23 27v10M42 29h.1M49 36h.1" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M29 14l5-7 5 7" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>';
    wrap.style.color='var(--ink)';
    old.replaceWith(wrap);
  }

  function addModal(){
    if(document.getElementById('pxz-game-modal')) return;
    const modal=document.createElement('div');
    modal.id='pxz-game-modal';
    modal.innerHTML='<div class="pxz-modal-box"><div class="pxz-modal-head"><span id="pxz-modal-title">Jogo</span><button class="pxz-modal-close" type="button">Fechar ✕</button></div><div class="pxz-modal-frame"></div></div>';
    document.body.appendChild(modal);
    modal.addEventListener('click',e=>{if(e.target===modal) closeGame()});
    modal.querySelector('.pxz-modal-close').onclick=closeGame;
  }
  function openGame(title,url){
    addModal();
    const modal=document.getElementById('pxz-game-modal');
    document.getElementById('pxz-modal-title').textContent=title;
    modal.querySelector('.pxz-modal-frame').innerHTML='<iframe src="'+url+'" title="'+title+'" allow="autoplay; fullscreen; gamepad" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>';
    modal.classList.add('open');
  }
  function closeGame(){
    const modal=document.getElementById('pxz-game-modal');
    if(!modal) return;
    modal.classList.remove('open');
    modal.querySelector('.pxz-modal-frame').innerHTML='';
  }
  window.addEventListener('keydown',e=>{if(e.key==='Escape') closeGame()});

  function addCatalogGames(){
    if(document.getElementById('pxz-extra-catalog')) return;
    const main=document.querySelector('.main') || document.querySelector('main');
    if(!main) return;
    const section=document.createElement('section');
    section.id='pxz-extra-catalog';
    section.innerHTML='<div class="cat-section-head"><div class="cat-section-icon" style="background:rgba(61,139,255,.15)">🎮</div><div><h3>Mais jogos</h3><span>Um destaque de cada catálogo</span></div></div><div class="pxz-extra-grid"></div>';
    const grid=section.querySelector('.pxz-extra-grid');
    const games=[
      ['Esportes','Soccer Random','Jogo de futebol para dois jogadores.','https://www.gamepix.com/play/soccer-random'],
      ['Tabuleiro','Xadrez','Partida de xadrez diretamente dentro do ProXZone.','https://gamezipper.com/chess/?utm_source=proxzone'],
      ['Ação','Slope','Desvie dos obstáculos e mantenha a bola na pista.','https://gamezipper.com/slope/?utm_source=proxzone']
    ];
    games.forEach(g=>{
      const card=document.createElement('article'); card.className='pxz-extra-card';
      card.innerHTML='<div style="font-size:11px;color:var(--blue);font-weight:800;text-transform:uppercase;letter-spacing:.8px">'+g[0]+'</div><h4>'+g[1]+'</h4><p>'+g[2]+'</p><button class="pxz-extra-play" type="button">Jogar agora ▶</button>';
      card.querySelector('button').onclick=()=>openGame(g[1],g[3]);
      grid.appendChild(card);
    });
    main.appendChild(section);
  }

  function addCalculator(){
    if(document.getElementById('pxz-calculator')) return;
    const calc=document.createElement('div'); calc.id='pxz-calculator';
    calc.innerHTML='<div class="pxz-calc-box"><div class="pxz-calc-brand">ProXZone</div><div class="pxz-calc-sub">Calculadora rápida antes de entrar</div><input class="pxz-calc-display" id="pxz-calc-display" value="" readonly><div class="pxz-calc-grid"><button data-v="C" class="op">C</button><button data-v="back" class="op">⌫</button><button data-v="(" class="op">(</button><button data-v=")" class="op">)</button><button data-v="7">7</button><button data-v="8">8</button><button data-v="9">9</button><button data-v="/" class="op">÷</button><button data-v="4">4</button><button data-v="5">5</button><button data-v="6">6</button><button data-v="*" class="op">×</button><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="-" class="op">−</button><button data-v="0">0</button><button data-v=".">.</button><button data-v="+" class="op">+</button><button data-v="=" class="eq">=</button></div><button class="pxz-enter" id="pxz-enter">Entrar no ProXZone 🎮</button></div>';
    document.body.appendChild(calc);
    const display=calc.querySelector('#pxz-calc-display');
    calc.querySelectorAll('[data-v]').forEach(btn=>btn.onclick=()=>{
      const v=btn.dataset.v;
      if(v==='C') display.value='';
      else if(v==='back') display.value=display.value.slice(0,-1);
      else if(v==='='){
        if(!/^[0-9+*/().\-\s]+$/.test(display.value)) return;
        try{const result=Function('"use strict";return ('+display.value+')')(); display.value=Number.isFinite(result)?String(result):'Erro'}catch(_){display.value='Erro'}
      } else if(display.value==='Erro') display.value=v; else display.value+=v;
    });
    calc.querySelector('#pxz-enter').onclick=()=>calc.classList.add('hide');
  }

  function boot(){
    replaceBrand();
    iconifyCategories();
    addCatalogGames();
    addCalculator();
    setTimeout(iconifyCategories,500);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>
'''
          if '</body>' not in s:
              raise SystemExit('closing body not found')
          s = s.replace('</body>', patch + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          print('Patch inserted successfully.')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Apply ProXZone UI calculator and catalog games"
          git push
