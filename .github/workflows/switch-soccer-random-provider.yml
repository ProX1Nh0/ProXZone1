name: Switch Soccer Random provider

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  switch-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Soccer Random embed provider
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          pattern = r"(futebol\s*:\s*function\(stage\)\s*\{.*?embedUrl:\s*['\"])([^'\"]+)(['\"])"
          replacement = r"\1https://www.miniplay.com/embed/soccer-random\3"
          s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Soccer Random embedUrl not found')

          page_pattern = r"(futebol\s*:\s*function\(stage\)\s*\{.*?pageUrl:\s*['\"])([^'\"]+)(['\"])"
          s, n2 = re.subn(page_pattern, replacement, s, count=1, flags=re.S)
          if n2 != 1:
              raise SystemExit('Soccer Random pageUrl not found')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit provider change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use Miniplay for Soccer Random"
          git push
