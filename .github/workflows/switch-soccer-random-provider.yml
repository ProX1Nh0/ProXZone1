name: Update ProXZone catalog and visuals

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-proxzone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update games, visuals and calculator
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Keep Soccer Random, but keep it on the GamePix provider.
          s = s.replace('https://www.miniplay.com/embed/soccer-random', 'https://www.gamepix.com/play/soccer-random')
          s = s.replace('https://www.bubbleshooter.net/embed.php?id=1502', 'https://www.gamepix.com/play/soccer-random')

          # Replace the old photographic logo in the upper-left with a game/controller symbol.
          logo = '''<div class="brand-logo" aria-label="ProXZone" title="ProXZone">
            <svg viewBox="0 0 64 44" fill="none" aria-hidden="true">
              <path d="M14 10h36c5.2 0 9.2 4.7 8.1 9.8l-3.2 14.8c-.8 3.8-5.6 5.1-8 2.1l-5.9-7.4H23l-5.9 7.4c-2.4 3-7.2 1.7-8-2.1L5.9 19.8C4.8 14.7 8.8 10 14 10Z" fill="url(#g)"/>
              <path d="M20 17v10M15 22h10M43 19.5h.1M49 25h.1" stroke="#07070f" stroke-width="3" stroke-linecap="round"/>
              <defs><linearGradient id="g" x1="6" y1="10" x2="58" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#3d8bff"/><stop offset=".55" stop-color="#a855f7"/><stop offset="1" stop-color="#ff4fd8"/></linearGradient></defs>
            </svg>
          </div>'''
          s, n = re.subn(r'<img class="brand-logo"[^>]*>', logo, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('brand logo not found')

          # Real web photos for the three catalog categories, sourced from Wikimedia Commons.
          photos = {
              'esporte': 'https://commons.wikimedia.org/wiki/Special:FilePath/Soccer_ball.jpg',
              'tabuleiro': 'https://commons.wikimedia.org/wiki/Special:FilePath/Chess_board.jpg',
              'acao': 'https://commons.wikimedia.org/wiki/Special:FilePath/Sports_car_(40652604980).jpg',
          }

          s = s.replace('icon: ICONS.futebol, g1:"#3d8bff", g2:"#1e50c9"', 'icon: ICONS.futebol, photo:"' + photos['esporte'] + '", g1:"#3d8bff", g2:"#1e50c9"', 1)
          s = s.replace('icon: ICONS.xadrez,  g1:"#a855f7", g2:"#6d28d9"', 'icon: ICONS.xadrez,  photo:"' + photos['tabuleiro'] + '", g1:"#a855f7", g2:"#6d28d9"', 1)
          s = s.replace('icon: ICONS.carro,   g1:"#ff8a3d", g2:"#e0631a"', 'icon: ICONS.carro,   photo:"' + photos['acao'] + '", g1:"#ff8a3d", g2:"#e0631a"', 1)

          css = '''\n  .brand-logo{width:52px;height:42px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 0 10px rgba(61,139,255,0.35));}\n  .brand-logo svg{width:52px;height:38px;display:block;}\n  .cat-photo{width:100%;height:100%;display:block;object-fit:cover;}\n  .cat-photo-frame{overflow:hidden;background:var(--bg-2);}\n  .cat-photo-frame img{width:100%;height:100%;object-fit:cover;display:block;}\n  .cat-photo-frame::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(7,7,15,.08),rgba(7,7,15,.38));pointer-events:none;}\n'''
          marker = '  .cat-icon svg{width:18px; height:18px;}\n'
          if css.strip() not in s:
              s = s.replace(marker, marker + css, 1)

          # Make sidebar/category visuals use the real category photos.
          sidebar_old = '<div class="cat-icon" style="background:linear-gradient(135deg, ${c.g1}, ${c.g2})">${c.icon}</div>'
          sidebar_new = '<div class="cat-icon cat-photo-frame" style="background:linear-gradient(135deg, ${c.g1}, ${c.g2});position:relative">${c.photo ? `<img class="cat-photo" src="${c.photo}" alt="${c.nome}" loading="lazy">` : c.icon}</div>'
          if sidebar_old in s:
              s = s.replace(sidebar_old, sidebar_new, 1)

          catalog_old = '<div class="cat-section-icon" style="background:linear-gradient(135deg, ${cat.g1}, ${cat.g2})">${cat.icon}</div>'
          catalog_new = '<div class="cat-section-icon cat-photo-frame" style="background:linear-gradient(135deg, ${cat.g1}, ${cat.g2});position:relative">${cat.photo ? `<img class="cat-photo" src="${cat.photo}" alt="${cat.nome}" loading="lazy">` : cat.icon}</div>'
          if catalog_old in s:
              s = s.replace(catalog_old, catalog_new, 1)

          # Give the action catalog a non-violent racing game and activate one game in each catalog.
          if '{id:"corrida"' not in s:
              game_marker = 'const GAMES = [\n'
              new_game = '  {id:"corrida",    nome:"Slope",              categoria:"acao", desc:"Desvie dos obstáculos e mantenha a bola na pista pelo maior tempo possível.", g1:"#ff8a3d", g2:"#e0631a"},\n'
              s = s.replace(game_marker, game_marker + new_game, 1)

          # Add a simple icon for Slope if it is not already present.
          if 'slope:' not in s:
              icon_marker = 'const GAMES = ['
              slope_icon = 'ICONS.slope = `<svg viewBox="0 0 24 24" fill="none"><path d="M3 18h18M5 15l4-5 4 3 5-7" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="10" r="2.3" fill="#fff"/></svg>`;\n\n'
              s = s.replace(icon_marker, slope_icon + icon_marker, 1)

          # Use the new icon for the added game card.
          s = s.replace('function iconBoxHTML(g){', 'function iconBoxHTML(g){\n  if(g.id === "corrida") return {style:`background:linear-gradient(135deg, ${g.g1}, ${g.g2})`, inner:ICONS.slope};', 1)

          # Activate Chess and Slope through GameZipper embeds.
          modules_marker = '  futebol: function(stage){'
          extra_modules = '''  xadrez: function(stage){
    embedExternalGame(stage, findGame('xadrez'), {
      embedUrl: 'https://gamezipper.com/chess/?utm_source=proxzone',
      pageUrl: 'https://gamezipper.com/chess/?utm_source=proxzone',
      ratio: '4/3'
    });
  },

  corrida: function(stage){
    embedExternalGame(stage, findGame('corrida'), {
      embedUrl: 'https://gamezipper.com/slope/?utm_source=proxzone',
      pageUrl: 'https://gamezipper.com/slope/?utm_source=proxzone',
      ratio: '4/3'
    });
  },

'''
          if 'xadrez: function(stage)' not in s:
              s = s.replace(modules_marker, extra_modules + modules_marker, 1)

          # Start-screen calculator: functional basic calculator + enter button.
          if '<div id="lock-screen"' not in s:
              calc_html = '''<div id="lock-screen" aria-label="Calculadora inicial">
  <div class="calc-app">
    <div class="calc-header">
      <div class="calc-app-title">proX calc</div>
      <div style="color:#8fd6a8;font-size:12px;font-weight:700">INÍCIO</div>
    </div>
    <div class="calc-display" id="start-calc-display">0</div>
    <div class="calc-panel">
      <div class="calc-grid">
        <button class="calc-btn danger" data-calc="C">C</button>
        <button class="calc-btn" data-calc="back">⌫</button>
        <button class="calc-btn" data-calc="/">÷</button>
        <button class="calc-btn accent" data-calc="*">×</button>
        <button class="calc-btn" data-calc="7">7</button><button class="calc-btn" data-calc="8">8</button><button class="calc-btn" data-calc="9">9</button><button class="calc-btn accent" data-calc="-">−</button>
        <button class="calc-btn" data-calc="4">4</button><button class="calc-btn" data-calc="5">5</button><button class="calc-btn" data-calc="6">6</button><button class="calc-btn accent" data-calc="+">+</button>
        <button class="calc-btn" data-calc="1">1</button><button class="calc-btn" data-calc="2">2</button><button class="calc-btn" data-calc="3">3</button><button class="calc-btn accent" data-calc="=">=</button>
        <button class="calc-btn wide" data-calc="0">0</button><button class="calc-btn" data-calc=".">.</button>
      </div>
      <div class="calc-hint" id="start-calc-hint">A calculadora voltou. Quando terminar, entre no ProXZone.</div>
    </div>
    <button id="enter-proxzone" style="margin-top:16px;width:100%;padding:13px 18px;border:0;border-radius:12px;background:linear-gradient(120deg,#3d8bff,#a855f7 55%,#ff4fd8);color:#07070f;font-weight:800;cursor:pointer">ENTRAR NO PROXZONE →</button>
  </div>
</div>\n\n'''
              s = s.replace('<div id="site">', calc_html + '<div id="site">', 1)

              calc_js = '''\n<script>\n(() => {\n  const display = document.getElementById('start-calc-display');\n  const lock = document.getElementById('lock-screen');\n  const enter = document.getElementById('enter-proxzone');\n  if(!display || !lock || !enter) return;\n  let expr = '';\n  const update = () => display.textContent = expr || '0';\n  document.querySelectorAll('[data-calc]').forEach(btn => btn.addEventListener('click', () => {\n    const v = btn.dataset.calc;\n    if(v === 'C') expr = '';\n    else if(v === 'back') expr = expr.slice(0,-1);\n    else if(v === '='){\n      try {\n        if(!/^[0-9+\\-*/.() ]+$/.test(expr)) throw new Error();\n        const result = Function('"use strict"; return (' + expr + ')')();\n        expr = Number.isFinite(result) ? String(result) : '';\n      } catch { expr = ''; }\n    } else {\n      expr += v;\n      if(expr.length > 18) expr = expr.slice(0,18);\n    }\n    update();\n  }));\n  enter.addEventListener('click', () => {\n    lock.classList.add('hidden');\n    setTimeout(() => lock.remove(), 550);\n  });\n})();\n</script>\n'''
              s = s.replace('</body>', calc_js + '</body>', 1)

          # Attribution for the real photos used in the catalog icons.
          if 'Créditos das imagens dos catálogos' not in s:
              credit = '''<div style="width:100%;text-align:center;padding:10px 16px 18px;color:#6f759b;font-size:10px;line-height:1.5">Créditos das imagens dos catálogos: Daniel Lobo (Soccer ball, CC BY 2.0); Mutante (Chess board, CC BY-SA 2.5); Zach Catanzareti Photo (Sports car, CC BY-SA 2.0), via Wikimedia Commons.</div>\n'''
              s = s.replace('</footer>', '</footer>\n' + credit, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit ProXZone update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@github.com"
          git add index.html .github/workflows/switch-soccer-random-provider.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add catalog games, real category photos and start calculator"
          git push
