name: Add Boxing Random
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Boxing Random
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          entry="{id:'boxing-random',title:'Boxing Random',cat:'sports',tag:'Esportes • Luta',cover:'https://math.geet.in.net/get/boxing-random/512x512.jpg',url:'https://math.geet.in.net/get/boxing-random/game.html'}"
          if 'id:\'boxing-random\'' not in s:
              marker="{id:'bitcoin-clicker',title:'Bitcoin Clicker'"
              pos=s.find(marker)
              if pos==-1:
                  raise SystemExit('Bitcoin Clicker entry not found')
              end=s.find('\n',pos)
              if end==-1:
                  raise SystemExit('Entry line end not found')
              s=s[:end]+',\n'+entry+s[end:]
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Boxing Random to sports"
          git push