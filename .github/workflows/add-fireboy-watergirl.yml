name: Add Fireboy and Watergirl
on:
  push:
    paths:
      - '.github/workflows/add-fireboy-watergirl.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  add-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add game
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          game = "{id:'fireboy-watergirl',title:'Fireboy and Watergirl',cat:'puzzle',tag:'Puzzle • 2 jogadores',cover:'https://math.geet.in.net/get/fire-boy-water-girl/logo.jpeg',url:'https://math.geet.in.net/get/fire-boy-water-girl/game.html'},"
          if "id:'fireboy-watergirl'" in s:
              print('Fireboy and Watergirl already exists; nothing to do.')
          else:
              anchor = "{id:'fnaf-2',title:'FNAF 2',cat:'horror',tag:'Terror • Survival',cover:'https://math.geet.in.net/get/fnaf/fnaf-2.jpg',url:'https://math.geet.in.net/get/fnaf/fnaf-2.html'},"
              if anchor not in s:
                  raise SystemExit('Expected FNAF 2 anchor not found; aborting to protect index.html.')
              s = s.replace(anchor, anchor + '\n' + game, 1)
              p.write_text(s, encoding='utf-8')
              print('Added Fireboy and Watergirl.')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No changes to commit.'
          else
            git add index.html
            git commit -m 'Add Fireboy and Watergirl game'
            git push
          fi
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/add-fireboy-watergirl.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/add-fireboy-watergirl.yml
          if git diff --cached --quiet; then
            echo 'Workflow already removed.'
          else
            git commit -m 'Remove temporary Fireboy workflow'
            git push
          fi