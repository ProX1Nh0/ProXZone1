name: Add Super Bomberman once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Adicionar Super Bomberman'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Super Bomberman and remove obsolete workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = "const games=["
          entry = "{id:'super-bomberman',title:'Super Bomberman',cat:'action',tag:'Ação • Clássico',cover:'https://www1.minijuegosgratis.com/v3/games/thumbnails/212389_7_sq.jpg',url:'https://www.miniplay.com/embed/super-bomberman'},"
          if "id:'super-bomberman'" not in s:
              if marker not in s:
                  raise SystemExit('games array not found; index.html left untouched')
              s = s.replace(marker, marker + entry, 1)
              p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/add-basket-random.yml .github/workflows/add-super-bomberman-once.yml

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-basket-random.yml .github/workflows/add-super-bomberman-once.yml
          git commit -m "Adicionar Super Bomberman"
          git push