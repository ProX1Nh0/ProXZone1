name: Configure 1v1 Soccer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch ProXZone
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the old injected catalog/provider block (Chess, Slope, GamePix, etc.).
          s = re.sub(r'\n<!-- PROXZONE-UI-PATCH -->[\s\S]*?\n</body>', '\n\n</body>', s, count=1)

          # Replace the existing Football card with the requested 1v1 Soccer game.
          s = re.sub(
              r'\{id:"futebol",\s+nome:"[^"]*",\s+categoria:"esporte",\s+desc:"[^"]*",\s+g1:"[^"]*",\s+g2:"[^"]*"\},',
              '{id:"futebol", nome:"1v1 Soccer", categoria:"esporte", desc:"Futebol 1 contra 1: escolha seu time e enfrente a IA ou outro jogador.", capa:"https://math.geet.in.net/get/1v1-soccer/logo.jpg", g1:"#3d8bff", g2:"#1e50c9"},',
              s, count=1)

          # Use the requested GEET game directly inside ProXZone.
          s = re.sub(
              r'\n\s*futebol:\s*function\(stage\)\{[\s\S]*?\n\s*\},\n\};',
              '''\n  futebol: function(stage){\n    embedExternalGame(stage, findGame('futebol'), {\n      embedUrl: 'https://math.geet.in.net/get/1v1-soccer/game.html',\n      pageUrl: 'https://math.geet.in.net/get/1v1-soccer/game.html',\n      ratio: '16/9'\n    });\n  },\n};''',
              s, count=1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use GEET 1v1 Soccer and remove old game providers"
          git push
