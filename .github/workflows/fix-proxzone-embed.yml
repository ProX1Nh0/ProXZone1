name: Fix ProXZone embed flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply embed fix
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s, n = re.subn(r'  \.game-stage\{.*?\n  \}', '''  .game-stage{
            background:var(--panel); border:1px solid var(--line); border-radius:16px;
            min-height:0; display:flex; align-items:stretch; justify-content:center;
            overflow:hidden; position:relative;
          }
          .game-embed{width:100%; max-width:1100px; margin:0 auto; aspect-ratio:16/9;
            position:relative; overflow:hidden; background:#000;}
          .game-embed iframe{position:absolute; inset:0; width:100%; height:100%; display:block; border:none;}
          @media (max-width:700px){.game-embed{aspect-ratio:4/3;}}''', s, count=1, flags=re.S)
          if n != 1: raise SystemExit('game-stage CSS not found')

          start = s.find('/* Embute de verdade um jogo hospedado')
          end = s.find('function findGame(id){', start)
          if start < 0 or end < 0: raise SystemExit('embed helper not found')
          helper = '''/* Embed interno: o jogo permanece dentro do ProXZone e não oferece redirecionamento. */
          function embedExternalGame(stage, game, opts){
            if(location.protocol === 'file:'){
              stage.innerHTML = `
                <div class="game-placeholder">
                  <div class="big-icon" style="background:linear-gradient(135deg, ${game.g1}, ${game.g2})">${ICONS[game.id]}</div>
                  <h3>Abra o ProXZone por HTTP/HTTPS</h3>
                  <p>Este embed precisa que o ProXZone seja servido por um servidor local ou publicado na web. Abra o site pelo endereço HTTP/HTTPS.</p>
                </div>`;
              return;
            }
            stage.innerHTML = `
              <div class="game-embed" style="aspect-ratio:${opts.ratio || '16/9'};">
                <iframe
                  src="${opts.embedUrl}"
                  title="${game.nome}"
                  loading="eager"
                  allow="autoplay; fullscreen; gamepad"
                  allowfullscreen
                  referrerpolicy="strict-origin-when-cross-origin"
                  style="position:absolute; inset:0; width:100%; height:100%; display:block; border:none;">
                </iframe>
              </div>`;
          }

          '''
          s = s[:start] + helper + s[end:]
          s = re.sub(r'\n?\s*<a[^>]*target=["\']_blank["\'][^>]*>.*?</a>', '', s, flags=re.S|re.I)
          s = s.replace('target="_blank"', '').replace("target='_blank'", '')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit corrected page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix embedded games staying inside ProXZone"
          git push
