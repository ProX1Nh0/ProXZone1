name: Update ProXZone UI controls
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch header controls and PX logo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_css = '.top-icon.active{color:#159cff;filter:drop-shadow(0 0 7px rgba(21,156,255,.45))}.icon-btn{border:0;background:transparent;padding:4px}'
          new_css = '''.top-icon.active{color:#159cff;filter:drop-shadow(0 0 7px rgba(21,156,255,.45))}.icon-btn{border:0;background:transparent;padding:4px}.theme-toggle{width:33px;height:33px;border:1px solid transparent;border-radius:50%;display:grid;place-items:center;background:transparent;color:#aebfd8;transition:.18s}.theme-toggle:hover{border-color:#2a5d8d;background:#0d223b;color:#fff}.theme-toggle svg{width:23px;height:23px}.light-theme{--bg:#edf3fa;--panel:#fff;--line:#cbd9e8;--text:#142235;--muted:#52657d;--blue:#087fe8}.light-theme{background:radial-gradient(circle at 76% 8%,rgba(14,111,230,.09),transparent 30%),#edf3fa;color:#142235}.light-theme .top{background:rgba(248,251,255,.96);border-bottom-color:#d4e0ec}.light-theme .brand .white{color:#16263a}.light-theme .brand .blue{color:#087fe8}.light-theme .brand small{color:#647993}.light-theme .search{background:#f8fbff;border-color:#c8d7e8;box-shadow:none}.light-theme .search input{color:#16263a}.light-theme .search input::placeholder{color:#7b8ca2}.light-theme .top-icon{color:#536b86}.light-theme .top-icon:hover{color:#087fe8}.light-theme .sidebar{background:linear-gradient(180deg,#f6f9fd,#eef4fa);border-right-color:#d3dfeb}.light-theme .side-label{color:#7489a0}.light-theme .nav button{color:#536b84}.light-theme .nav button svg{color:#66809d}.light-theme .nav button:hover{background:#e2edf8;color:#17314d}.light-theme .nav button.active{background:linear-gradient(90deg,#0a78e8,#0865c8);color:#fff}.light-theme .side-sep{background:#d6e2ee}.light-theme .section-head .big-icon{background:#e3f1ff;border-color:#9bc8f0;color:#087fe8;box-shadow:none}.light-theme .section-head p{color:#61758d}.light-theme .section-head .line{background:#d1deea}.light-theme .card{border-color:#cbd9e8;background:linear-gradient(180deg,#fff,#f5f9fd);box-shadow:0 10px 24px rgba(34,67,103,.10)}.light-theme .card:hover{border-color:#5ca6e8;box-shadow:0 14px 28px rgba(25,113,193,.14)}.light-theme .tag{background:#e4f1ff;color:#075fae;border-color:#a5cef1}.light-theme .play-row{color:#5a6f87}.light-theme .play-row svg{color:#087fe8}.light-theme .game-view{border-color:#cbd9e8;background:#f8fbff;box-shadow:0 0 24px rgba(15,133,255,.10)}.light-theme .game-top{border-bottom-color:#d4e0ec}.light-theme .game-control,.light-theme .back{border-color:#bfd0e1;background:#eef4fa;color:#46627f}.light-theme .game-control:hover{border-color:#5ca6e8;background:#e3f1ff;color:#123c63}.light-theme .stage{background:#dfe8f2}.light-theme footer{border-top-color:#d4e0ec;color:#74879d}.light-theme .empty{border-color:#b9cfe4;color:#71849b}.light-theme .empty strong{color:#20364f}'''
          if old_css in s and 'light-theme .top{' not in s:
              s = s.replace(old_css, new_css)
          old_brand = '<svg viewBox="0 0 80 55" fill="none"><path d="M15 17h16a8 8 0 0 1 8 8v5H23a8 8 0 0 1-8-8v-5Z" stroke="#fff" stroke-width="4"/><path d="M65 17H49a8 8 0 0 0-8 8v5h16a8 8 0 0 0 8-8v-5Z" stroke="#159bff" stroke-width="4"/><path d="M23 34v7M57 34v7M31 31h18" stroke="#159bff" stroke-width="4" stroke-linecap="round"/></svg>'
          new_brand = '<svg viewBox="0 0 80 55" fill="none" aria-label="PX"><text x="3" y="39" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="900" letter-spacing="-5" fill="currentColor">P</text><path d="M43 14 71 42M71 14 43 42" stroke="#159bff" stroke-width="5" stroke-linecap="round"/></svg>'
          if old_brand in s:
              s = s.replace(old_brand, new_brand)
          old_home = '<button class="icon-btn" title="Início" onclick="setCategory(\'all\')"><svg class="top-icon active" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9Z"/></svg></button><button class="icon-btn" title="Jogos" onclick="setCategory(\'all\')"><svg class="top-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="12" rx="4"/><path d="M8 13h4M10 11v4M16 12h.01M18 14h.01"/></svg></button>'
          new_home = '<button class="icon-btn" title="Início" onclick="goHome()"><svg class="top-icon active" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9Z"/></svg></button><button class="icon-btn theme-toggle" id="themeToggle" title="Tema claro/escuro" onclick="toggleTheme()" aria-label="Alternar tema"></button>'
          if old_home in s:
              s = s.replace(old_home, new_home)
          old_js = "function setCategory(cat){currentCat=cat;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));const h=document.querySelector('.section-head h1'),p=document.querySelector('.section-head p');if(cat==='sports'){h.textContent='Esportes';p.textContent='Jogos esportivos para competir e se divertir.'}else if(cat==='action'){h.textContent='Ação';p.textContent='Jogos de ação para testar seus reflexos.'}else if(cat==='racing'){h.textContent='Corrida';p.textContent='Acelere e tente bater seus recordes.'}else if(cat==='puzzle'){h.textContent='Puzzle';p.textContent='Desafios para exercitar a mente.'}else{h.textContent='Esportes';p.textContent='Jogos esportivos para competir e se divertir.'}renderGames();}"
          new_js = old_js + "\nfunction goHome(){if(!$('gameView').style.display||$('gameView').style.display==='none'){setCategory('all');return;}closeGame();setCategory('all');}\nfunction setThemeIcon(){const dark=!$('portal').classList.contains('light-theme');$('themeToggle').innerHTML=dark?'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42\"/></svg>':'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M20 15.3A8.5 8.5 0 0 1 8.7 4 8.5 8.5 0 1 0 20 15.3Z\"/></svg>';$('themeToggle').title=dark?'Tema claro':'Tema escuro';}\nfunction toggleTheme(){const light=$('portal').classList.toggle('light-theme');localStorage.setItem('proxzone-theme',light?'light':'dark');setThemeIcon();}\nfunction loadTheme(){if(localStorage.getItem('proxzone-theme')==='light')$('portal').classList.add('light-theme');setThemeIcon();}"
          if "function goHome(){" not in s:
              s = s.replace(old_js, new_js)
          old_open = "function openPortal(){$('accessScreen').classList.add('hidden');$('portal').classList.remove('hidden');setCategory('all');}"
          new_open = "function openPortal(){$('accessScreen').classList.add('hidden');$('portal').classList.remove('hidden');loadTheme();setCategory('all');}"
          if old_open in s:
              s = s.replace(old_open, new_open)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Melhora navegação, tema e logo PX"
          git push
