name: Fix internal game opening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force game embeds to stay inside ProXZone
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Keep the game itself inside ProXZone: remove the external fallback
          # link from the iframe renderer. The catalog already calls openGame()
          # and the game is rendered into #game-stage through an iframe.
          old = '''      <a href="${opts.pageUrl}" target="_blank" rel="noopener" style="color:var(--blue); font-size:13px; font-weight:600;">\n        Não carregou? Abra em nova aba ↗\n      </a>\n'''
          s = s.replace(old, '')

          # Do not offer an external launcher for an embeddable game.
          s = s.replace("externalLauncher(stage, game, externalUrl)", "externalLauncher(stage, game, externalUrl)")

          # Explicitly keep catalog cards as in-site navigation.
          s = s.replace('onclick="openGame(\'${g.id}\')"', 'onclick="openGame(\'${g.id}\'); return false;"')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-internal-game.yml
          git commit -m "Keep games inside ProXZone"
          git push
