<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProXZone — Jogos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#06101f;--bg2:#081527;--panel:#0b192d;--panel2:#0d1d34;--line:#193556;--line2:#24466e;--text:#f5f8ff;--muted:#a9b8cf;--blue:#0b8cff;--blue2:#1765dc;--cyan:#19b9ff;--glow:0 0 24px rgba(15,133,255,.16)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 76% 8%,rgba(14,111,230,.10),transparent 30%),radial-gradient(circle at 42% 50%,rgba(5,62,130,.08),transparent 38%),var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}
.top{height:84px;display:grid;grid-template-columns:310px minmax(280px,490px) 310px;align-items:center;justify-content:space-between;padding:0 34px;background:rgba(5,14,28,.96);border-bottom:1px solid #102640;position:sticky;top:0;z-index:100;backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:30px;letter-spacing:-1.5px}.brand svg{width:70px;height:50px;filter:drop-shadow(0 0 10px rgba(0,143,255,.35))}.brand .white{color:#f7f9ff}.brand .blue{color:#159bff}.brand small{display:block;font-size:10px;letter-spacing:1px;color:#a8b9d3;margin-top:-3px}
.search{height:46px;border:1px solid #1a3a61;border-radius:24px;background:#0a1a30;display:flex;align-items:center;padding:0 17px;box-shadow:inset 0 0 18px rgba(0,0,0,.14)}.search svg{width:22px;color:#9eb3d0;flex:none}.search input{width:100%;border:0;outline:0;background:transparent;color:#fff;padding:0 12px;font-size:15px}.search input::placeholder{color:#91a3bd}.top-actions{display:flex;justify-content:flex-end;align-items:center;gap:25px}.top-icon{width:25px;height:25px;color:#aebfd8;transition:.18s}.top-icon:hover{color:#1da7ff;transform:translateY(-1px)}.top-icon.active{color:#159cff;filter:drop-shadow(0 0 7px rgba(21,156,255,.45))}.icon-btn{border:0;background:transparent;padding:4px}
.shell{display:grid;grid-template-columns:246px 1fr;min-height:calc(100vh - 84px)}
.sidebar{border-right:1px solid #122a47;background:linear-gradient(180deg,rgba(6,17,32,.96),rgba(5,14,27,.96));padding:25px 14px 35px;position:sticky;top:84px;height:calc(100vh - 84px);overflow:auto}.side-label{font-size:10px;font-weight:800;color:#5f7898;text-transform:uppercase;letter-spacing:1.4px;padding:0 18px 10px}.nav{display:flex;flex-direction:column;gap:4px}.nav button{height:45px;border:0;border-radius:8px;background:transparent;color:#b7c7de;text-align:left;padding:0 18px;display:flex;align-items:center;gap:15px;font-size:14px;font-weight:600;transition:.18s}.nav button svg{width:21px;height:21px;flex:none;color:#a9bdd8}.nav button:hover{background:#0c2039;color:#fff}.nav button.active{background:linear-gradient(90deg,#075dce,#0d4ebd);color:#fff;box-shadow:0 7px 20px rgba(0,87,205,.18);position:relative}.nav button.active:before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:#17c1ff}.nav button.active svg{color:#d8f5ff}.side-sep{height:1px;background:#132b47;margin:18px 12px}.side-bottom{margin-top:18px;padding:0 10px}.side-bottom button{width:100%;border:1px solid #18395d;background:#091a30;color:#b9c9de;border-radius:9px;padding:11px;font-weight:700}.side-bottom button:hover{border-color:#2870b7;color:#fff}
.main{min-width:0;padding:25px 24px 55px}.page{max-width:1265px;margin:0 auto}.section-head{display:flex;align-items:center;gap:14px;margin:0 0 23px}.section-head .big-icon{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;color:#18a7ff;background:#0a2746;border:1px solid #1e5a91;box-shadow:0 0 22px rgba(0,139,255,.15)}.section-head .big-icon svg{width:27px}.section-head h1{margin:0;font-size:31px;letter-spacing:-.8px}.section-head p{margin:3px 0 0;color:#91a6c2;font-size:14px}.section-head .line{height:1px;background:#173756;flex:1;margin-left:5px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.card{border:1px solid #1a3c62;border-radius:13px;background:linear-gradient(180deg,#0b1b31,#09172a);overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.2);transition:.18s;cursor:pointer}.card:hover{transform:translateY(-3px);border-color:#2877ba;box-shadow:0 16px 34px rgba(0,89,181,.16)}.cover{height:174px;background:#020913 center/cover no-repeat;position:relative}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(4,13,25,.28))}.card-body{padding:12px 16px 15px}.card-title{font-size:16px;font-weight:800;margin-bottom:9px}.tag{display:inline-flex;padding:5px 11px;border-radius:14px;background:#063f91;color:#bceaff;border:1px solid #0b72cb;font-size:11px;font-weight:800}.play-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px;color:#afc1d9;font-size:13px}.play-row span{display:flex;align-items:center;gap:9px}.play-row svg{width:20px;color:#0fa3ff}.chev{width:22px!important;color:#a6b8cf!important}
.empty{display:none;text-align:center;padding:60px 20px;border:1px dashed #214263;border-radius:14px;color:#8da1bb}.empty strong{display:block;color:#fff;margin-bottom:7px}
.game-view{display:none;margin-top:25px;border:1px solid #1a3d64;border-radius:14px;background:#09172a;overflow:hidden;box-shadow:var(--glow)}.game-top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 17px;border-bottom:1px solid #173654}.game-name{display:flex;align-items:center;gap:12px}.game-name .mini{width:37px;height:37px;border-radius:8px;object-fit:cover;border:1px solid #26537e}.game-name h2{margin:0;font-size:18px}.back{border:1px solid #25486d;background:#0b1c32;color:#bcd0e8;border-radius:8px;padding:8px 13px;font-weight:700}.stage{padding:10px;background:#030b15}.stage iframe{display:block;width:100%;height:min(72vh,760px);border:0;border-radius:8px;background:#000}.loading{display:none;min-height:280px;align-items:center;justify-content:center;color:#9eb1ca;gap:10px}.spinner{width:23px;height:23px;border:3px solid #24466a;border-top-color:#18a7ff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:rgba(0,4,12,.75);display:none;align-items:center;justify-content:center;z-index:300;padding:20px;backdrop-filter:blur(7px)}.modal.open{display:flex}.access{width:min(390px,100%);border:1px solid #225184;border-radius:15px;background:linear-gradient(180deg,#0c1e35,#071426);box-shadow:0 25px 70px rgba(0,0,0,.5);padding:24px}.access h2{margin:0 0 7px}.access p{color:#9eb1c9;font-size:13px;margin:0 0 18px}.access-display{height:58px;border:1px solid #1b466f;border-radius:10px;background:#020b16;display:flex;align-items:center;justify-content:flex-end;padding:0 16px;font-size:25px;font-weight:800;margin-bottom:10px}.access-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.access-keys button{height:48px;border:0;border-radius:8px;background:#e7e9ed;color:#07101b;font-weight:800}.access-keys .red{background:#e9423b;color:#fff}.access-keys .gold{background:#b99a5b;color:#fff}.access-keys .zero{grid-column:span 2}.access-enter{width:100%;height:48px;margin-top:12px;border:0;border-radius:9px;background:linear-gradient(100deg,#087dff,#3151e8);color:#fff;font-weight:900}.close-modal{float:right;border:0;background:transparent;color:#9eb1c9;font-size:23px}
footer{max-width:1265px;margin:0 auto;border-top:1px solid #163553;padding:22px 4px;color:#7186a2;font-size:12px;text-align:center}
@media(max-width:1050px){.top{grid-template-columns:240px minmax(240px,1fr) 190px;padding:0 20px}.shell{grid-template-columns:205px 1fr}.sidebar{padding-left:9px;padding-right:9px}.nav button{padding:0 13px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.top{height:72px;grid-template-columns:1fr auto;padding:0 15px}.brand{font-size:25px}.brand svg{width:55px}.brand small{display:none}.search{position:absolute;top:80px;left:14px;right:14px;display:none}.top-actions{gap:14px}.shell{display:block}.sidebar{position:sticky;top:72px;height:auto;border-right:0;border-bottom:1px solid #142f4d;padding:8px;z-index:60}.nav{display:flex;flex-direction:row;overflow:auto;gap:5px}.side-label,.side-sep,.side-bottom{display:none}.nav button{min-width:max-content;height:40px;padding:0 12px;gap:7px;font-size:12px}.nav button svg{width:17px}.main{padding:22px 13px 45px}.section-head h1{font-size:25px}.section-head p{display:none}.section-head .line{display:none}.cards{grid-template-columns:1fr;gap:14px}.cover{height:190px}.game-top{height:58px}.stage iframe{height:70vh}}
@media(max-width:430px){.top-actions .hide-small{display:none}.brand{font-size:22px}.brand svg{width:48px}.section-head .big-icon{width:38px;height:38px}.section-head h1{font-size:22px}}
</style>
</head>
<body>
<header class="top">
<a class="brand" href="#" onclick="showAll();return false;" aria-label="ProXZone">
<svg viewBox="0 0 100 70" aria-hidden="true"><path d="M20 20C8 22 5 39 10 51c3 8 10 11 17 8l11-5 12 8c7 5 14 2 16-5l2-7c4 1 8 0 12-3 7-5 10-13 6-21-4-8-13-11-21-7l-8 4-12-3-11-3c-8-2-14 0-19 3z" fill="#f7f9ff" stroke="#159cff" stroke-width="3"/><path d="M34 22v16M26 30h16" stroke="#159cff" stroke-width="5" stroke-linecap="round"/><circle cx="70" cy="27" r="4" fill="#159cff"/><circle cx="79" cy="34" r="4" fill="#159cff"/><circle cx="64" cy="38" r="3" fill="#159cff"/></svg>
<span><span class="white">ProX<span class="blue">Zone</span></span><small>JOGUE SEM LIMITES</small></span></a>
<label class="search" aria-label="Buscar jogos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg><input id="search" type="search" placeholder="Buscar jogos..." oninput="searchGames(this.value)"></label>
<div class="top-actions">
<button class="icon-btn" title="Início" onclick="showAll()"><svg class="top-icon active" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10.8 12 3l9 7.8v9.2a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button>
<button class="icon-btn" title="Jogos" onclick="showAll()"><svg class="top-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10a5 5 0 0 1 4.8 6.4l-1.2 4.1a2.8 2.8 0 0 1-5 1l-1.1-1.5H9.5L8.4 18.5a2.8 2.8 0 0 1-5-1l-1.2-4.1A5 5 0 0 1 7 7zm1 2H6v2H4v2h2v2h2v-2h2v-2H8zm8 1a1.3 1.3 0 1 0 0-2.6A1.3 1.3 0 0 0 16 10zm3 3a1.3 1.3 0 1 0 0-2.6A1.3 1.3 0 0 0 19 13z"/></svg></button>
<button class="icon-btn" title="Acesso ProXZone" onclick="openAccess()"><svg class="top-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M6 2h12a2 2 0 0 1 2 2v16H4V4a2 2 0 0 1 2-2zm1 3v5h10V5zm1 9h3v2H8zm5 0h3v2h-3zM8 18h3v1H8zm5 0h3v1h-3z"/></svg></button>
<button class="icon-btn" title="Configurações" onclick="document.documentElement.classList.toggle('compact')"><svg class="top-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M19.4 13a7.8 7.8 0 0 0 0-2l2-1.5-2-3.4-2.4 1a7.5 7.5 0 0 0-1.7-1L15 3h-4l-.4 3.1a7.5 7.5 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.5a7.8 7.8 0 0 0 0 2l-2 1.5 2 3.4 2.4-1a7.5 7.5 0 0 0 1.7 1L11 21h4l.4-3.1a7.5 7.5 0 0 0 1.7-1l2.4 1 2-3.4zM13 15.5A3.5 3.5 0 1 1 13 8a3.5 3.5 0 0 1 0 7.5z"/></svg></button>
</div></header>
<div class="shell">
<aside class="sidebar"><div class="side-label">Categorias</div><nav class="nav" id="nav">
<button class="active" data-cat="Todos" onclick="filterCat('Todos',this)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h6v6H4zm10 0h6v6h-6zM4 14h6v6H4zm10 0h6v6h-6z"/></svg>Todos os Jogos</button>
<button data-cat="Ação" onclick="filterCat('Ação',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 7v10M7 12h10"/></svg>Ação</button>
<button data-cat="Aventura" onclick="filterCat('Aventura',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="m15 9-3 6-3-3 6-3z"/></svg>Aventura</button>
<button data-cat="Plataforma" onclick="filterCat('Plataforma',this)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 5h5v5H5zm9 0h5v5h-5zM5 14h5v5H5zm9 0h5v5h-5z"/></svg>Plataforma</button>
<button data-cat="Corrida" onclick="filterCat('Corrida',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 18 2-6 3-2 2-4 3 1"/><circle cx="7" cy="18" r="2"/></svg>Corrida</button>
<button data-cat="Esportes" onclick="filterCat('Esportes',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="m7 7 5 3 5-3m-5 3v7m-5-3 5 3 5-3"/></svg>Esportes</button>
<button data-cat="Luta" onclick="filterCat('Luta',this)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 3h4v7H8zm5 0h3v6h-3zM5 8h4v8H5zm8 4h5v5h-5zM7 15h5v6H7z"/></svg>Luta</button>
<button data-cat="Puzzle" onclick="filterCat('Puzzle',this)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 4a3 3 0 0 1 6 0v1h2a3 3 0 0 1 0 6h-1v3h-4v-1a3 3 0 0 0-6 0v-3H4a3 3 0 0 1 0-6h2V4a3 3 0 0 1 3 0z"/></svg>Puzzle</button>
<button data-cat="Tiro" onclick="filterCat('Tiro',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4m10-10h-4M6 12H2"/></svg>Tiro</button>
<button data-cat="Arcade" onclick="filterCat('Arcade',this)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 7h14a4 4 0 0 1 4 4v5a3 3 0 0 1-5.3 1.9L15 16H9l-2.7 1.9A3 3 0 0 1 1 16v-5a4 4 0 0 1 4-4z"/></svg>Arcade</button>
<button data-cat="RPG" onclick="filterCat('RPG',this)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 4 5v6c0 5 3.4 9.2 8 11 4.6-1.8 8-6 8-11V5z"/></svg>RPG</button>
<button data-cat="Estratégia" onclick="filterCat('Estratégia',this)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2 3 6h6l-5 4 2 7-6-3-6 3 2-7-5-4h6z"/></svg>Estratégia</button>
<button data-cat="Simulação" onclick="filterCat('Simulação',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19h16M6 16V8h12v8M9 8V5h6v3"/></svg>Simulação</button>
</nav><div class="side-sep"></div><div class="side-bottom"><button onclick="openAccess()">🔐 Acesso ProXZone</button></div></aside>
<main class="main"><div class="page">
<div class="section-head"><div class="big-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="m7 7 5 3 5-3m-5 3v7m-5-3 5 3 5-3"/></svg></div><div><h1 id="sectionTitle">Todos os Jogos</h1><p id="sectionDesc">Escolha uma categoria e encontre um jogo para começar.</p></div><div class="line"></div></div>
<div class="cards" id="cards"></div><div class="empty" id="empty"><strong>Nenhum jogo encontrado</strong>Tente outra busca ou categoria.</div>
<div class="game-view" id="gameView"><div class="game-top"><div class="game-name"><img class="mini" id="gameMini" src="" alt=""><div><h2 id="gameTitle">Jogo</h2></div></div><button class="back" onclick="closeGame()">‹ &nbsp; Voltar</button></div><div class="stage"><div class="loading" id="loading"><span class="spinner"></span>Carregando o jogo...</div><iframe id="gameFrame" src="about:blank" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe></div></div>
<footer>ProXZone • Jogue sem limites</footer>
</div></main></div>
<div class="modal" id="accessModal" onclick="if(event.target===this)closeAccess()"><div class="access"><button class="close-modal" onclick="closeAccess()">×</button><h2>Entrar no ProXZone</h2><p>Digite a senha para liberar o acesso.</p><div class="access-display" id="accessDisplay">0</div><div class="access-keys"><button class="red" onclick="acClear()">C</button><button class="gold" onclick="acBack()">⌫</button><button class="gold" onclick="acSign()">↩</button><button onclick="acPress('7')">7</button><button onclick="acPress('8')">8</button><button onclick="acPress('9')">9</button><button onclick="acPress('4')">4</button><button onclick="acPress('5')">5</button><button onclick="acPress('6')">6</button><button onclick="acPress('1')">1</button><button onclick="acPress('2')">2</button><button onclick="acPress('3')">3</button><button class="zero" onclick="acPress('0')">0</button><button onclick="acClear()">OK</button></div><button class="access-enter" onclick="enterProXZone()">ENTRAR NO PROXZONE</button></div></div>
<script>
const games=[
{name:'1v1 Soccer',cat:'Esportes',img:'https://math.geet.in.net/get/1v1-soccer/logo.jpg',url:'https://math.geet.in.net/get/1v1-soccer/game.html'},
{name:'Basket Random',cat:'Esportes',img:'https://math.geet.in.net/get/basket-random/BasketRandom.png',url:'https://math.geet.in.net/get/basket-random/game.html'},
{name:'Basketball Stars',cat:'Esportes',img:'https://math.geet.in.net/get/basketball-stars/assets/images/basketball-stars.png',url:'https://math.geet.in.net/get/basketball-stars/game.html'}
];
let activeCat='Todos',query='';let access='0',fresh=true;
const cards=document.getElementById('cards'),empty=document.getElementById('empty');
function render(){const list=games.filter(g=>(activeCat==='Todos'||g.cat===activeCat)&&g.name.toLowerCase().includes(query.toLowerCase()));cards.innerHTML=list.map(g=>`<article class="card" onclick="openGame('${g.name.replace(/'/g,"\\'")}','${g.cat}','${g.url}','${g.img}')"><div class="cover" style="background-image:url('${g.img}')"></div><div class="card-body"><div class="card-title">${g.name}</div><span class="tag">${g.cat}</span><div class="play-row"><span><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10a5 5 0 0 1 4.8 6.4l-1.2 4.1a2.8 2.8 0 0 1-5 1l-1.1-1.5H9.5L8.4 18.5a2.8 2.8 0 0 1-5-1l-1.2-4.1A5 5 0 0 1 7 7z"/></svg>Jogar agora</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg></div></div></article>`).join('');empty.style.display=list.length?'none':'block'}
function filterCat(cat,btn){activeCat=cat;document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');document.getElementById('sectionTitle').textContent=cat==='Todos'?'Todos os Jogos':cat;document.getElementById('sectionDesc').textContent=cat==='Esportes'?'Ação, habilidade e muita diversão! Escolha seu esporte favorito e jogue agora.':cat==='Todos'?'Escolha uma categoria e encontre um jogo para começar.':'Jogos da categoria '+cat+'.';closeGame();render()}
function searchGames(v){query=v;render()}
function showAll(){activeCat='Todos';query='';document.getElementById('search').value='';const b=document.querySelector('[data-cat="Todos"]');filterCat('Todos',b);window.scrollTo({top:0,behavior:'smooth'})}
function openGame(name,cat,url,img){document.getElementById('gameTitle').textContent=name;document.getElementById('gameMini').src=img;document.getElementById('gameView').style.display='block';document.getElementById('loading').style.display='flex';const f=document.getElementById('gameFrame');f.onload=()=>document.getElementById('loading').style.display='none';f.src=url;document.getElementById('gameView').scrollIntoView({behavior:'smooth',block:'start'})}
function closeGame(){const v=document.getElementById('gameView');if(v.style.display!=='none'){document.getElementById('gameFrame').src='about:blank';v.style.display='none'}}
function openAccess(){document.getElementById('accessModal').classList.add('open');acClear()}
function closeAccess(){document.getElementById('accessModal').classList.remove('open')}
function acRender(){document.getElementById('accessDisplay').textContent=access}
function acClear(){access='0';fresh=true;acRender()}
function acPress(n){if(fresh){access=n;fresh=false}else if(access==='0'&&n==='0'){access+='0'}else if(access.length<14){access+=n}acRender()}
function acBack(){if(fresh||access.length<=1){acClear();return}access=access.slice(0,-1);acRender()}
function acSign(){if(access!=='0')access=access.startsWith('-')?access.slice(1):'-'+access;acRender()}
function enterProXZone(){if(access==='0000'){closeAccess();window.scrollTo({top:0,behavior:'smooth'});return}document.getElementById('accessDisplay').textContent='Senha incorreta';setTimeout(acClear,850)}
render();
</script>
</body>
</html>
