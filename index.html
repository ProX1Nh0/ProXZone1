<style>
:root{--bg:#06101f;--panel:#0b192d;--line:#193556;--text:#f5f8ff;--muted:#a9b8cf;--blue:#0b8cff;--calc-bg:#274f57;--calc-panel:#02131d;--calc-key:#d0d0d0;--calc-gold:#9d8755;--calc-red:#ce4233}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 76% 8%,rgba(14,111,230,.1),transparent 30%),radial-gradient(circle at 42% 50%,rgba(5,62,130,.08),transparent 38%),var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}.hidden{display:none!important}
#accessScreen{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;background:var(--calc-bg);padding:25px 18px 45px;color:#fff}.calc-wrap{width:400px;max-width:100%}.calc-head{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 1px 8px}.calc-name{font-size:30px;font-weight:500;letter-spacing:-1px}.code-mode{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:1px;color:#f2f2f2}.mode-switch{width:50px;height:26px;border:0;border-radius:20px;background:#07141e;padding:3px;display:flex;justify-content:flex-start;align-items:center;transition:.18s}.mode-switch span{width:20px;height:20px;border-radius:50%;background:#ef4739;display:block;box-shadow:0 0 7px rgba(239,71,57,.25);transition:.18s}.mode-switch.active{justify-content:flex-end}.mode-switch.active span{background:#21b7ff}.calc-display{height:96px;border-radius:15px;background:var(--calc-panel);display:flex;align-items:center;justify-content:flex-end;padding:0 25px;font-size:43px;font-weight:400;color:#f1f2c9;letter-spacing:1px;overflow:hidden;margin-bottom:18px}.calc-display.number-pop{animation:numberPop .16s ease-out}.calc-pad{background:#03121c;border-radius:18px;padding:19px 20px 18px}.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.calc-key{height:80px;border:0;border-radius:11px;background:var(--calc-key);color:#0b0d0f;font-size:25px;font-weight:500;box-shadow:none;transition:transform .08s,filter .12s}.calc-key:hover{filter:brightness(1.04)}.calc-key:active{transform:scale(.94)}.calc-key.gold{background:var(--calc-gold);color:#fff}.calc-key.pressed{animation:keyPress .16s ease-out}.calc-bottom{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.calc-bottom .calc-key{height:33px;font-size:21px;font-weight:600}.calc-bottom .equals{background:var(--calc-red);color:#fff}.calc-msg{height:18px;text-align:center;font-size:11px;color:#ef8d83;margin-top:7px;opacity:0;transition:.15s}.calc-msg.show{opacity:1}@keyframes keyPress{0%{transform:scale(1)}45%{transform:scale(.92)}100%{transform:scale(1)}}@keyframes numberPop{0%{transform:translateY(7px);opacity:.25}100%{transform:translateY(0);opacity:1}}
#portal{min-height:100vh}.top{height:84px;display:grid;grid-template-columns:310px minmax(280px,490px) 310px;align-items:center;justify-content:space-between;padding:0 34px;background:rgba(5,14,28,.96);border-bottom:1px solid #102640;position:sticky;top:0;z-index:100;backdrop-filter:blur(14px)}.brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:30px;letter-spacing:-1.5px}.brand svg{width:70px;height:50px;filter:drop-shadow(0 0 10px rgba(0,143,255,.35))}.brand .white{color:#f7f9ff}.brand .blue{color:#159bff}.brand small{display:block;font-size:10px;letter-spacing:1px;color:#a8b9d3;margin-top:-3px}.search{height:46px;border:1px solid #1a3a61;border-radius:24px;background:#0a1a30;display:flex;align-items:center;padding:0 17px;box-shadow:inset 0 0 18px rgba(0,0,0,.14)}.search svg{width:22px;color:#9eb3d0;flex:none}.search input{width:100%;border:0;outline:0;background:transparent;color:#fff;padding:0 12px;font-size:15px}.search input::placeholder{color:#91a3bd}.top-actions{display:flex;justify-content:flex-end;align-items:center;gap:25px}.top-icon{width:25px;height:25px;color:#aebfd8;transition:.18s}.top-icon:hover{color:#1da7ff;transform:translateY(-1px)}.top-icon.active{color:#159cff;filter:drop-shadow(0 0 7px rgba(21,156,255,.45))}.icon-btn{border:0;background:transparent;padding:4px}
.shell{display:grid;grid-template-columns:246px 1fr;min-height:calc(100vh - 84px)}.sidebar{border-right:1px solid #122a47;background:linear-gradient(180deg,rgba(6,17,32,.96),rgba(5,14,27,.96));padding:25px 14px 35px;position:sticky;top:84px;height:calc(100vh - 84px);overflow:auto}.side-label{font-size:10px;font-weight:800;color:#5f7898;text-transform:uppercase;letter-spacing:1.4px;padding:0 18px 10px}.nav{display:flex;flex-direction:column;gap:4px}.nav button{height:45px;border:0;border-radius:8px;background:transparent;color:#b7c7de;text-align:left;padding:0 18px;display:flex;align-items:center;gap:15px;font-size:14px;font-weight:600;transition:.18s}.nav button svg{width:21px;height:21px;flex:none;color:#a9bdd8}.nav button:hover{background:#0c2039;color:#fff}.nav button.active{background:linear-gradient(90deg,#075dce,#0d4ebd);color:#fff;box-shadow:0 7px 20px rgba(0,87,205,.18);position:relative}.nav button.active:before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:#17c1ff}.nav button.active svg{color:#d8f5ff}.side-sep{height:1px;background:#132b47;margin:18px 12px}.main{min-width:0;padding:25px 24px 55px}.page{max-width:1265px;margin:0 auto}.section-head{display:flex;align-items:center;gap:14px;margin:0 0 23px}.section-head .big-icon{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;color:#18a7ff;background:#0a2746;border:1px solid #1e5a91;box-shadow:0 0 22px rgba(0,139,255,.15)}.section-head .big-icon svg{width:27px}.section-head h1{margin:0;font-size:31px;letter-spacing:-.8px}.section-head p{margin:3px 0 0;color:#91a6c2;font-size:14px}.section-head .line{height:1px;background:#173756;flex:1;margin-left:5px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.card{border:1px solid #1a3c62;border-radius:13px;background:linear-gradient(180deg,#0b1b31,#09172a);overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.2);transition:.18s;cursor:pointer}.card:hover{transform:translateY(-3px);border-color:#2877ba;box-shadow:0 16px 34px rgba(0,89,181,.16)}.cover{height:174px;background:#020913;position:relative;overflow:hidden}.cover img{width:100%;height:100%;display:block;object-fit:cover;object-position:center;transition:transform .25s}.card:hover .cover img{transform:scale(1.025)}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(4,13,25,.28));pointer-events:none}.cover-fallback{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;gap:8px;background:radial-gradient(circle at 50% 30%,#123e72,#030b16 72%);color:#dff4ff;text-align:center;padding:15px}.cover-fallback strong{font-size:22px}.cover-fallback span{font-size:11px;color:#8fb1d2}.card-body{padding:12px 16px 15px}.card-title{font-size:16px;font-weight:800;margin-bottom:9px}.tag{display:inline-flex;padding:5px 11px;border-radius:14px;background:#063f91;color:#bceaff;border:1px solid #0b72cb;font-size:11px;font-weight:800}.play-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px;color:#afc1d9;font-size:13px}.play-row span{display:flex;align-items:center;gap:9px}.play-row svg{width:20px;color:#0fa3ff}.chev{width:22px!important;color:#a6b8cf!important}.empty{display:none;text-align:center;padding:60px 20px;border:1px dashed #214263;border-radius:14px;color:#8da1bb}.empty strong{display:block;color:#fff;margin-bottom:7px}
.game-view{display:none;margin-top:25px;border:1px solid #1a3d64;border-radius:14px;background:#09172a;overflow:hidden;box-shadow:0 0 24px rgba(15,133,255,.16)}.game-top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 17px;border-bottom:1px solid #173654}.game-name{display:flex;align-items:center;gap:12px}.game-name .mini{width:37px;height:37px;border-radius:8px;object-fit:cover;border:1px solid #26537e}.game-name h2{margin:0;font-size:18px}.game-actions{display:flex;align-items:center;gap:8px}.game-control{height:38px;min-width:38px;border:1px solid #25486d;background:#0b1c32;color:#c4d7ed;border-radius:8px;display:grid;place-items:center;font-size:17px;transition:.18s}.game-control:hover{border-color:#2c7bc5;background:#102844;color:#fff}.back{border:1px solid #25486d;background:#0b1c32;color:#bcd0e8;border-radius:8px;padding:8px 13px;font-weight:700}.stage{padding:10px;background:#030b15}.stage iframe{display:block;width:100%;height:min(72vh,760px);border:0;border-radius:8px;background:#000}.stage:fullscreen{width:100vw;height:100vh;padding:0;margin:0;border:0;border-radius:0;background:#000;display:flex;align-items:center;justify-content:center}.stage:fullscreen iframe{width:min(100vw,177.78vh);height:min(100vh,56.25vw);max-width:100vw;max-height:100vh;border-radius:0;flex:0 0 auto}.loading{display:none;min-height:280px;align-items:center;justify-content:center;color:#9eb1ca;gap:10px}.spinner{width:23px;height:23px;border:3px solid #24466a;border-top-color:#18a7ff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}footer{max-width:1265px;margin:0 auto;border-top:1px solid #163553;padding:22px 4px;color:#7186a2;font-size:12px;text-align:center}
@media(max-width:1050px){.top{grid-template-columns:240px minmax(240px,1fr) 190px;padding:0 20px}.shell{grid-template-columns:205px 1fr}.sidebar{padding-left:9px;padding-right:9px}.nav button{padding:0 13px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){#accessScreen{padding:16px 10px 30px}.calc-wrap{width:400px}.calc-head{height:48px}.calc-name{font-size:27px}.code-mode{font-size:10px}.calc-display{height:92px}.calc-pad{padding:17px 18px}.calc-grid{gap:10px}.calc-key{height:72px}.calc-bottom{gap:10px;margin-top:10px}.top{height:72px;grid-template-columns:1fr auto;padding:0 15px}.brand{font-size:25px}.brand svg{width:55px}.brand small{display:none}.search{position:absolute;top:80px;left:14px;right:14px;display:none}.top-actions{gap:14px}.shell{display:block}.sidebar{position:sticky;top:72px;height:auto;border-right:0;border-bottom:1px solid #142f4d;padding:8px;z-index:60}.nav{display:flex;flex-direction:row;overflow:auto;gap:5px}.side-label,.side-sep{display:none}.nav button{min-width:max-content;height:40px;padding:0 12px;gap:7px;font-size:12px}.nav button svg{width:17px}.main{padding:22px 13px 45px}.section-head h1{font-size:25px}.section-head p{display:none}.section-head .line{display:none}.cards{grid-template-columns:1fr;gap:14px}.cover{height:190px}.game-top{height:58px}.stage iframe{height:70vh}.game-actions{gap:5px}.game-control{height:34px;min-width:34px;font-size:15px}.back{padding:7px 10px}}
@media(max-width:430px){.top-actions{gap:7px}.brand{font-size:22px}.brand svg{width:48px}.section-head .big-icon{width:38px;height:38px}.section-head h1{font-size:22px}.game-name h2{font-size:16px}.game-name .mini{width:32px;height:32px}.calc-pad{padding:14px}.calc-grid{gap:8px}.calc-key{height:65px}.calc-bottom{gap:8px}.calc-display{height:84px;font-size:37px}}

<body>
<section id="accessScreen">
  <div class="calc-wrap">
    <div class="calc-head">
      <div class="calc-name">calc</div>
      <div class="code-mode"><span>CODE MODE</span><button class="mode-switch" id="modeSwitch" onclick="toggleCodeMode()" aria-label="Alternar modo código"><span></span></button></div>
    </div>
    <div class="calc-display" id="accessDisplay">0</div>
    <div class="calc-pad">
      <div class="calc-grid">
        <button class="calc-key" onclick="calcInput('7')">7</button><button class="calc-key" onclick="calcInput('8')">8</button><button class="calc-key" onclick="calcInput('9')">9</button><button class="calc-key gold" onclick="calcDelete()">DEL</button>
        <button class="calc-key" onclick="calcInput('4')">4</button><button class="calc-key" onclick="calcInput('5')">5</button><button class="calc-key" onclick="calcInput('6')">6</button><button class="calc-key" onclick="calcInput('+')">+</button>
        <button class="calc-key" onclick="calcInput('1')">1</button><button class="calc-key" onclick="calcInput('2')">2</button><button class="calc-key" onclick="calcInput('3')">3</button><button class="calc-key" onclick="calcInput('-')">-</button>
        <button class="calc-key" onclick="calcInput('.')">.</button><button class="calc-key" onclick="calcInput('0')">0</button><button class="calc-key" onclick="calcInput('/')">/</button><button class="calc-key" onclick="calcInput('*')">x</button>
      </div>
      <div class="calc-bottom"><button class="calc-key gold" onclick="calcReset()">RESET</button><button class="calc-key equals" onclick="calcEquals()">=</button></div>
      <div class="calc-msg" id="calcMsg">Código incorreto</div>
    </div>
  </div>
</section>
<section id="portal" class="hidden">
<header class="top"><div class="brand"><svg viewBox="0 0 100 70" aria-hidden="true"><path d="M20 20C8 22 5 39 10 51c3 8 10 11 17 8l11-5 12 8c7 5 14 2 16-5l2-7c4 1 8 0 12-3 7-5 10-13 6-21-4-8-13-11-21-7l-8 4-12-3-11-3c-8-2-14 0-19 3z" fill="#f7f9ff" stroke="#159cff" stroke-width="3"/><path d="M34 22v16M26 30h16" stroke="#159cff" stroke-width="5" stroke-linecap="round"/><circle cx="70" cy="27" r="4" fill="#159cff"/><circle cx="79" cy="34" r="4" fill="#159cff"/><circle cx="64" cy="38" r="3" fill="#159cff"/></svg><span><span class="white">ProX</span><span class="blue">Zone</span><small>JOGUE SEM LIMITES</small></span></div><label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg><input id="searchInput" type="search" placeholder="Pesquisar jogos..." oninput="filterGames()"></label><div class="top-actions"><button class="icon-btn" title="Início" onclick="showAll()"><svg class="top-icon active" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11.5 12 4l9 7.5"></path><path d="M5.5 10.5V20h13v-9.5M9.5 20v-5h5v5"></path></svg></button><button class="icon-btn" title="Jogos" onclick="showAll()"><svg class="top-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="12" rx="3"></rect><path d="M8 12v4M6 14h4M16 12h.01M18 15h.01"></path></svg></button><button class="icon-btn" title="Calculadora" onclick="returnToAccess()"><svg class="top-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M8 7h8M8 11h2M14 11h2M8 15h2M14 15h2M8 18h8"></path></svg></button><button class="icon-btn" title="Sair" onclick="returnToAccess()"><svg class="top-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 5H5v14h5"></path><path d="M13 8l4 4-4 4M9 12h8"></path></svg></button></div></header>
<div class="shell"><aside class="sidebar"><div class="side-label">Categorias</div><nav class="nav"><button class="active" data-category="Todos os Jogos" onclick="selectCategory('Todos os Jogos',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>Todos os Jogos</button><button data-category="Ação" onclick="selectCategory('Ação',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2.2 5.1L20 10l-5.8 1.9L12 17l-2.2-5.1L4 10l-4.8-1.9L12 3z"></path></svg>Ação</button><button data-category="Esportes" onclick="selectCategory('Esportes',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"></circle><path d="m8.5 6.5 3.5 2 3.5-2M5 13l3.5-2.5M15.5 10.5 19 13M9 18l1.5-4h3L15 18"></path></svg>Esportes</button><button data-category="Corrida" onclick="selectCategory('Corrida',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 17h14M7 13h10M9 9h6M12 5v4"></path></svg>Corrida</button><button data-category="Puzzle" onclick="selectCategory('Puzzle',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3h4v4h2V3h4v4h4v4h-4v2h4v4h-4v4h-4v-4h-2v4H7v-4H3v-4h4v-2H3V7h4V3z"></path></svg>Puzzle</button></nav></aside>
<main class="main"><div class="page"><div class="section-head"><div class="big-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"></circle><path d="m8.5 6.5 3.5 2 3.5-2M5 13l3.5-2.5M15.5 10.5 19 13M9 18l1.5-4h3L15 18"></path></svg></div><div><h1 id="sectionTitle">Todos os Jogos</h1><p>Escolha um jogo e comece a jogar.</p></div><div class="line"></div></div><div class="cards" id="cards"></div><div class="empty" id="empty"><strong>Nenhum jogo encontrado</strong>Tente outra busca ou categoria.</div><div class="game-view" id="gameView"><div class="game-top"><div class="game-name"><img class="mini" id="gameMini"><div><h2 id="gameTitle">Jogo</h2></div></div><div class="game-actions"><button class="game-control" onclick="toggleFullscreen()" title="Tela cheia" aria-label="Tela cheia">⛶</button><button class="back" onclick="closeGame()">‹ &nbsp; Voltar</button></div></div><div class="stage" id="gameStage"><div class="loading" id="loading"><span class="spinner"></span>Carregando o jogo...</div><iframe id="gameFrame" title="Jogo" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe></div></div><footer>ProXZone • Jogos em um só lugar</footer></div></main></div></section>
<script>
const $=id=>document.getElementById(id);
const games=[{name:'1v1 Soccer',category:'Esportes',url:'https://math.geet.in.net/get/1v1-soccer/game.html',img:'https://math.geet.in.net/get/1v1-soccer/logo.jpg'},{name:'Basket Random',category:'Esportes',url:'https://math.geet.in.net/get/basket-random/game.html',img:'https://math.geet.in.net/get/basket-random/BasketRandom.png'},{name:'Basketball Stars',category:'Esportes',url:'https://math.geet.in.net/get/basketball-stars/game.html',img:'https://math.geet.in.net/get/basketball-stars/assets/images/basketball-stars.png'}];
let calcValue='0',codeMode=false,currentCategory='Todos os Jogos',currentSearch='';
function renderCalc(animate=false){const d=$('accessDisplay');d.textContent=calcValue||'0';if(animate){d.classList.remove('number-pop');void d.offsetWidth;d.classList.add('number-pop');}}
function animateKey(v){const buttons=[...document.querySelectorAll('.calc-key')];const b=buttons.find(x=>x.textContent.trim()===v||(v==='*'&&x.textContent.trim()==='x'));if(!b)return;b.classList.remove('pressed');void b.offsetWidth;b.classList.add('pressed');setTimeout(()=>b.classList.remove('pressed'),180);}
function toggleCodeMode(){codeMode=!codeMode;$('modeSwitch').classList.toggle('active',codeMode);calcValue='0';$('calcMsg').classList.remove('show');renderCalc();}
function calcInput(v){$('calcMsg').classList.remove('show');animateKey(v);if(calcValue==='0'&&v==='0')calcValue='00';else if(calcValue==='0'&&/[0-9.]/.test(v))calcValue=v;else calcValue+=v;if(calcValue.length>18)calcValue=calcValue.slice(0,18);renderCalc(true);}
function calcDelete(){$('calcMsg').classList.remove('show');animateKey('DEL');if(calcValue.length<=1)calcValue='0';else calcValue=calcValue.slice(0,-1);renderCalc(true);}
function calcReset(){animateKey('RESET');calcValue='0';$('calcMsg').classList.remove('show');renderCalc(true)}
function calcEquals(){$('calcMsg').classList.remove('show');animateKey('=');if(calcValue==='0000'){openPortal();return}if(codeMode){$('calcMsg').classList.add('show');setTimeout(()=>{$('calcMsg').classList.remove('show')},1200);return}try{const expression=calcValue.replace(/x/g,'*');if(!/^[0-9+\-*/.()\s]+$/.test(expression))throw new Error();const result=Function('"use strict";return ('+expression+')')();if(!Number.isFinite(result))throw new Error();calcValue=String(Number(result.toFixed(10)));}catch(e){calcValue='Error'}renderCalc(true)}
function openPortal(){$('accessScreen').classList.add('hidden');$('portal').classList.remove('hidden');calcValue='0';renderCalc();showAll();window.scrollTo({top:0,behavior:'instant'})}
function returnToAccess(){closeGame();$('portal').classList.add('hidden');$('accessScreen').classList.remove('hidden');calcValue='0';codeMode=false;$('modeSwitch').classList.remove('active');renderCalc();window.scrollTo({top:0,behavior:'instant'})}
function renderCards(){const list=games.filter(g=>(currentCategory==='Todos os Jogos'||g.category===currentCategory)&&(!currentSearch||g.name.toLowerCase().includes(currentSearch.toLowerCase())));$('cards').innerHTML=list.map((g,i)=>`<article class="card" onclick="openGame(games[${games.indexOf(g)}])"><div class="cover"><img src="${g.img}" alt="${g.name}" referrerpolicy="no-referrer" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="cover-fallback"><strong>${g.name}</strong><span>${g.category}</span></div></div><div class="card-body"><div class="card-title">${g.name}</div><span class="tag">${g.category}</span><div class="play-row"><span><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>Jogar agora</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"></path></svg></div></div></article>`).join('');$('empty').style.display=list.length?'none':'block';}
function selectCategory(category,btn){currentCategory=category;document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');$('sectionTitle').textContent=category;renderCards();closeGame()}
function showAll(){currentCategory='Todos os Jogos';currentSearch='';$('searchInput').value='';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.category==='Todos os Jogos'));$('sectionTitle').textContent='Todos os Jogos';renderCards();closeGame()}
function filterGames(){currentSearch=$('searchInput').value.trim();renderCards();closeGame()}
function openGame(g){$('gameView').style.display='block';$('cards').style.display='none';$('sectionTitle').textContent=g.name;$('gameTitle').textContent=g.name;$('gameMini').src=g.img;$('loading').style.display='flex';$('gameFrame').style.display='none';$('gameFrame').src=g.url;setTimeout(()=>{$('loading').style.display='none';$('gameFrame').style.display='block'},650);window.scrollTo({top:0,behavior:'smooth'})}
function closeGame(){$('gameView').style.display='none';$('cards').style.display='grid'}
function toggleFullscreen(){const stage=$('gameStage');if(document.fullscreenElement){document.exitFullscreen?.();return}stage.requestFullscreen?.().catch(()=>{})}
document.addEventListener('keydown',e=>{if($('accessScreen').classList.contains('hidden'))return;if(e.key>='0'&&e.key<='9'){calcInput(e.key);return}if(['+','-','/','*','.'].includes(e.key)){calcInput(e.key);return}if(e.key==='x'||e.key==='X'){calcInput('*');return}if(e.key==='Backspace'){calcDelete();return}if(e.key==='Escape'){calcReset();return}if(e.key==='Enter'||e.key==='='){calcEquals()}});
renderCalc();renderCards();
</script>
</body>
</html>
