reen().catch(()=>{});$('gameFrame').src='';$('gameView').style.display='none';$('cards').style.display='grid';renderGames();window.scrollTo({top:0,behavior:'smooth'})}function toggleFullscreen(){const s=$('stage');if(!document.fullscreenElement)(s.requestFullscreen||s.webkitRequestFullscreen).call(s).catch(()=>{});else(document.exitFullscreen||document.webkitExitFullscreen).call(document)}function toggleCodeMode(){codeMode=!codeMode;$('modeSwitch').classList.toggle('active',codeMode)}function calcInput(v){if(calcValue==='0'&&v==='0')calcValue='00';else if(calcValue==='0'&&v!=='.'&&!'+-*/'.includes(v))calcValue=v;else calcValue+=v;$('accessDisplay').textContent=calcValue}function calcDelete(){calcValue=calcValue.length>1?calcValue.slice(0,-1):'0';$('accessDisplay').textContent=calcValue}function calcReset(){calcValue='0';codeMode=false;$('modeSwitch').classList.remove('active');$('calcMsg').classList.remove('show');$('accessDisplay').textContent='0'}function calcEquals(){if(codeMode&&calcValue==='0000'){openPortal();return}if(codeMode){$('calcMsg').textContent='Código incorreto';$('calcMsg').classList.add('show');return}try{if(!/^[0-9+\-*/(). ]+$/.test(calcValue))throw Error();let r=Function('"use strict";return ('+calcValue+')')();if(!Number.isFinite(r))throw Error();calcValue=String(r);$('accessDisplay').textContent=calcValue}catch(e){$('calcMsg').textContent='Expressão inválida';$('calcMsg').classList.add('show')}}function openPortal(){$('accessScreen').classList.add('hidden');$('portal').classList.remove('hidden');loadTheme();setCategory('all')}function returnToAccess(){$('portal').classList.add('hidden');$('accessScreen').classList.remove('hidden');calcReset()}document.addEventListener('keydown',e=>{if(!$('portal').classList.contains('hidden'))return;if(e.key>='0'&&e.key<='9')calcInput(e.key);else if('+-*/.'.includes(e.key))calcInput(e.key);else if(e.key==='Backspace')calcDelete();else if(e.key==='Escape')calcReset();else if(e.key==='Enter')calcEquals()});$('gam
