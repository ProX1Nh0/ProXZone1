{id:'boxing-random',title:'Boxing Random',cat:'sports',tag:'Esportes • Luta',cover:'https://math.geet.in.net/get/boxing-random/512x512.jpg',url:'https://math.geet.in.net/get/boxing-random/game.html'}
];
let currentCat='all',calcValue='0',codeMode=false;
const $=id=>document.getElementById(id);
function renderGames(){const q=($('searchInput').value||'').toLowerCase().trim();const list=games.filter(g=>(currentCat==='all'||g.cat===currentCat)&&(!q||g.title.toLowerCase().includes(q)||g.tag.toLowerCase().includes(q)));$('cards').innerHTML=list.map(g=>`<article class="card" onclick="openGame('${g.id}')"><div class="cover"><img src="${g.cover}" alt="Capa de ${g.title}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="cover-fallback"><strong>${g.title}</strong><span>ProXZone</span></div></div><div class="card-body"><div class="card-title">${g.title}</div><span class="tag">${g.tag}</span><div class="play-row"><span><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7L8 5Z"/></svg>Jogar agora</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></div></div></article>`).join('');$('empty').style.display=list.length?'none':'block';}
function setCategory(cat){currentCat=cat;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));const h=document.querySelector('.section-head h1'),p=document.querySelector('.section-head p');if(cat==='sports'){h.textContent='Esportes';p.textContent='Jogos esportivos para competir e se divertir.'}else if(cat==='action'){h.textContent='Ação';p.textContent='Jogos de ação para testar seus reflexos.'}else if(cat==='racing'){h.textContent='Corrida';p.textContent='Acelere e tente bater seus recordes.'}else if(cat==='puzzle'){h.textContent='Puzzle';p.textContent='Desafios para exercitar a mente.'}else{h.textContent='Esportes';p.textContent='Jogos esportivos para competir e se divertir.'}renderGames();}
function goHome(){if(!$('gameView').style.display||$('gameView').style.display==='none'){setCategory('all');return;}closeGame();setCategory('all');}
function setThemeIcon(){const dark=!$('portal').classList.contains('light-theme');$('themeToggle').innerHTML=dark?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 15.3A8.5 8.5 0 0 1 8.7 4 8.5 8.5 0 1 0 20 15.3Z"/></svg>';$('themeToggle').title=dark?'Tema claro':'Tema escuro';}
function toggleTheme(){const light=$('portal').classList.toggle('light-theme');localStorage.setItem('proxzone-theme',light?'light':'dark');setThemeIcon();}
function loadTheme(){if(localStorage.getItem('proxzone-theme')==='light')$('portal').classList.add('light-theme');setThemeIcon();}
function filterGames(){renderGames();}
function openGame(id){const g=games.find(x=>x.id===id);if(!g)return;$('cards').style.display='none';$('empty').style.display='none';$('gameView').style.display='block';$('gameTitle').textContent=g.title;$('gameMini').src=g.cover;$('loading').style.display='flex';$('gameFrame').style.display='none';$('gameFrame').src=g.url;setTimeout(()=>{$('loading').style.display='none';$('gameFrame').style.display='block'},900);window.scrollTo({top:0,behavior:'smooth'});}
function closeGame(){if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});$('gameFrame').src='';$('gameView').style.display='none';$('cards').style.display='grid';renderGames();}
function toggleFullscreen(){const stage=$('stage');if(!document.fullscreenElement){(stage.requestFullscreen||stage.webkitRequestFullscreen).call(stage).catch(()=>{});}else{(document.exitFullscreen||document.webkitExitFullscreen).call(document);}}
function toggleCodeMode(){codeMode=!codeMode;$('modeSwitch').classList.toggle('active',codeMode);}
function animateKey(el){if(!el)return;el.classList.remove('pressed');void el.offsetWidth;el.classList.add('pressed');}
function calcInput(v,el){if(calcValue==='0'&&v==='0')calcValue='00';else if(calcValue==='0'&&v!=='.'&&!'+-*/'.includes(v))calcValue=v;else calcValue+=v;updateCalc(el||document.activeElement);}
function updateCalc(el){$('accessDisplay').textContent=calcValue;$('accessDisplay').classList.remove('number-pop');void $('accessDisplay').offsetWidth;$('accessDisplay').classList.add('number-pop');if(el&&el.classList&&el.classList.contains('calc-key'))animateKey(el);}
function calcDelete(){calcValue=calcValue.length>1?calcValue.slice(0,-1):'0';updateCalc();}
function calcReset(){calcValue='0';codeMode=false;$('modeSwitch').classList.remove('active');$('calcMsg').classList.remove('show');updateCalc();}
function calcEquals(){if(calcValue==='0000'){openPortal();return;}if(codeMode){$('calcMsg').classList.add('show');return;}try{if(!/^[0-9+\-*/(). ]+$/.test(calcValue))throw Error();let result=Function('"use strict";return ('+calcValue.replace(/x/g,'*')+')')();if(!Number.isFinite(result))throw Error();calcValue=String(result);updateCalc();}catch(e){$('calcMsg').textContent='Expressão inválida';$('calcMsg').classList.add('show');}}
function openPortal(){$('accessScreen').classList.add('hidden');$('portal').classList.remove('hidden');loadTheme();setCategory('all');}
function returnToAccess(){$('portal').classList.add('hidden');$('accessScreen').classList.remove('hidden');calcReset();}
document.addEventListener('keydown',e=>{if(!$('portal').classList.contains('hidden'))return;if(e.key>='0'&&e.key<='9')calcInput(e.key);else if('+-*/.'.includes(e.key))calcInput(e.key);else if(e.key==='Backspace')calcDelete();else if(e.key==='Escape')calcReset();else if(e.key==='Enter')calcEquals();});
$('gameFrame').addEventListener('load',()=>{$('loading').style.display='none';$('gameFrame').style.display='block'});
renderGames();
</script>
</body>
</html>
