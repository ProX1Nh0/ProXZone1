<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProXZone — Minigames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#07070f;
    --bg-1:#0d0e1c;
    --bg-2:#121428;
    --panel:#12142a;
    --line:#252842;
    --ink:#eef0ff;
    --ink-soft:#9a9fc4;
    --blue:#3d8bff;
    --purple:#a855f7;
    --magenta:#ff4fd8;
    --grad: linear-gradient(120deg, var(--blue), var(--purple) 55%, var(--magenta));
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 700px 400px at 10% -5%, rgba(61,139,255,0.16), transparent 60%),
      radial-gradient(ellipse 700px 400px at 95% 10%, rgba(255,79,216,0.14), transparent 55%),
      var(--bg-0);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Orbitron', sans-serif;}
  a{text-decoration:none; color:inherit;}
  ::selection{background:var(--magenta); color:#07070f;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important; transition-duration:.01ms !important;}
  }

  /* ---------- TOP NAV ---------- */
  .topnav{
    position:sticky; top:0; z-index:60;
    display:flex; align-items:center; gap:22px;
    padding:12px clamp(16px,4vw,40px);
    background:rgba(7,7,15,0.82);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .brand-logo{height:42px; display:block; filter:drop-shadow(0 0 10px rgba(61,139,255,0.35));}
  .searchbar{
    flex:1; max-width:480px;
    display:flex; align-items:center; gap:8px;
    background:var(--bg-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:9px 14px;
  }
  .searchbar input{
    background:transparent; border:none; outline:none; color:var(--ink);
    font-size:14px; width:100%;
  }
  .searchbar input::placeholder{color:var(--ink-soft);}
  .nav-right{display:flex; align-items:center; gap:16px; margin-left:auto; font-size:14px; font-weight:600;}
  .nav-icon{
    width:36px; height:36px; border-radius:50%;
    background:var(--bg-2); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
  }
  .nav-cta{
    padding:9px 18px; border-radius:8px;
    background:var(--grad); color:#07070f; font-weight:700;
  }
  @media (max-width:820px){ .searchbar{display:none;} }

  /* ---------- LAYOUT ---------- */
  .layout{
    display:grid;
    grid-template-columns:250px 1fr;
    gap:26px;
    padding:26px clamp(16px,4vw,40px) 60px;
    align-items:start;
  }
  @media (max-width:940px){ .layout{grid-template-columns:1fr;} }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
    position:sticky; top:76px;
  }
  .sidebar-title{
    font-size:11.5px; font-weight:700; color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:1px;
    padding:4px 8px 12px;
  }
  .cat-item{
    display:flex; align-items:center; gap:12px;
    padding:10px; border-radius:10px;
    cursor:pointer;
    margin-bottom:4px;
    border:1px solid transparent;
    transition:background .15s ease, border-color .15s ease;
  }
  .cat-item:hover{background:rgba(255,255,255,0.04);}
  .cat-item.active{
    background:rgba(61,139,255,0.12);
    border-color:rgba(61,139,255,0.4);
  }
  .cat-icon{
    width:36px; height:36px; border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    background:var(--g1, var(--blue));
    flex-shrink:0;
  }
  .cat-icon svg{width:18px; height:18px;}
  .cat-text b{display:block; font-size:13px; font-weight:700;}
  .cat-text span{display:block; font-size:11px; color:var(--ink-soft); margin-top:1px;}

  @media (max-width:940px){
    .sidebar{
      position:static;
      display:flex; overflow-x:auto; gap:8px;
      padding:12px;
    }
    .sidebar-title{display:none;}
    .cat-item{flex-direction:column; text-align:center; min-width:80px; gap:6px;}
    .cat-text span{display:none;}
  }

  /* ---------- MAIN ---------- */
  .main{display:flex; flex-direction:column; gap:44px;}

  /* Hero */
  .hero-card{
    position:relative;
    border-radius:18px;
    overflow:hidden;
    background:
      radial-gradient(ellipse 480px 260px at 25% 30%, rgba(61,139,255,0.35), transparent 60%),
      radial-gradient(ellipse 420px 260px at 85% 70%, rgba(255,79,216,0.3), transparent 60%),
      var(--bg-2);
    border:1px solid var(--line);
    padding:40px clamp(20px,4vw,52px);
    display:flex; align-items:center; justify-content:space-between;
    gap:24px;
    min-height:220px;
  }
  .hero-text{max-width:440px; z-index:2;}
  .hero-eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:12px; font-weight:700; letter-spacing:1px; color:var(--blue);
    margin-bottom:12px;
  }
  .hero-dot{width:7px; height:7px; border-radius:50%; background:var(--magenta); box-shadow:0 0 8px var(--magenta); animation:blink 1.4s infinite steps(1);}
  @keyframes blink{50%{opacity:0.2;}}
  .hero-card h2{font-size:clamp(24px,3.4vw,32px); margin:0 0 10px; line-height:1.2;}
  .hero-card p{font-size:14.5px; line-height:1.6; margin:0 0 22px; color:var(--ink-soft);}
  .hero-btn{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--grad); color:#07070f;
    font-weight:700; font-size:14.5px;
    padding:13px 24px; border-radius:10px;
  }
  .hero-art{display:flex; align-items:center; gap:14px; z-index:2;}
  .hero-art .cat-icon{width:76px; height:76px; border-radius:16px; box-shadow:0 14px 30px -10px rgba(0,0,0,0.6);}
  .hero-art .cat-icon svg{width:38px; height:38px;}
  .hero-art .cat-icon.mid{width:94px; height:94px;}
  .hero-art .cat-icon.mid svg{width:48px; height:48px;}
  @media (max-width:760px){ .hero-card{flex-direction:column; text-align:center;} .hero-art{display:none;} }

  /* Category sections */
  .cat-section-head{display:flex; align-items:center; gap:14px; margin-bottom:18px;}
  .cat-section-icon{
    width:40px; height:40px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
  }
  .cat-section-icon svg{width:21px; height:21px;}
  .cat-section-head h3{font-size:18px; margin:0;}
  .cat-section-head span{font-size:12.5px; color:var(--ink-soft); display:block; margin-top:2px;}
  .cat-count{
    margin-left:auto; font-size:12px; font-weight:700; color:var(--blue);
    background:rgba(61,139,255,0.12); padding:5px 12px; border-radius:20px;
  }

  /* Catalog grid */
  .catalog{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:16px;
  }
  @media (max-width:1050px){ .catalog{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:600px){ .catalog{grid-template-columns:1fr;} }

  .game-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
    display:flex; flex-direction:column; gap:12px;
    transition:box-shadow .18s ease, transform .18s ease, border-color .18s ease;
  }
  .game-card:hover{
    box-shadow:0 16px 34px -16px rgba(61,139,255,0.35);
    transform:translateY(-3px);
    border-color:rgba(61,139,255,0.4);
  }
  .game-top{display:flex; align-items:center; gap:12px;}
  .game-top .cat-icon{width:46px; height:46px; border-radius:11px;}
  .game-top .cat-icon svg{width:24px; height:24px;}
  .game-name{font-size:15px; font-weight:700;}
  .game-tag{font-size:11px; color:var(--ink-soft); font-weight:600;}
  .game-desc{font-size:13px; color:var(--ink-soft); line-height:1.5; flex:1;}
  .game-foot{display:flex; align-items:center; justify-content:space-between; border-top:1px solid var(--line); padding-top:12px;}
  .details-link{font-size:13px; font-weight:700; color:var(--blue);}
  .play-round{
    width:34px; height:34px; border-radius:50%;
    background:var(--grad); color:#07070f;
    display:flex; align-items:center; justify-content:center;
    font-size:12px;
  }
  .game-card{cursor:pointer;}

  /* ---------- GAME VIEW ---------- */
  .game-back{
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--ink);
    font-size:13px; font-weight:600;
    padding:10px 16px;
    border-radius:9px;
    cursor:pointer;
    margin-bottom:22px;
  }
  .game-back:hover{border-color:rgba(61,139,255,0.4); color:var(--blue);}
  .game-view-head{
    display:flex; align-items:center; gap:16px;
    margin-bottom:20px;
  }
  .game-view-head .cat-icon{width:56px; height:56px; border-radius:13px;}
  .game-view-head .cat-icon svg{width:28px; height:28px;}
  .game-view-head h2{font-size:22px; margin:0;}
  .game-view-head span{font-size:13px; color:var(--ink-soft);}
  .game-stage{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    min-height:min(70vh, 560px);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    position:relative;
  }
  .game-placeholder{
    text-align:center; max-width:380px; padding:30px;
    color:var(--ink-soft);
  }
  .game-placeholder .big-icon{
    width:64px; height:64px; border-radius:16px;
    margin:0 auto 18px;
    display:flex; align-items:center; justify-content:center;
  }
  .game-placeholder .big-icon svg{width:32px; height:32px;}
  .game-placeholder h3{color:var(--ink); font-size:17px; margin:0 0 8px;}
  .game-placeholder p{font-size:13.5px; line-height:1.6; margin:0;}

  .launcher{
    width:100%; max-width:560px; margin:0 auto;
    display:flex; flex-direction:column; align-items:center;
    padding:28px 20px;
  }
  .launcher-cover{
    width:100%; aspect-ratio:16/10;
    border-radius:14px;
    background-size:cover; background-position:center;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 20px 40px -18px rgba(0,0,0,0.6);
    margin-bottom:20px;
  }
  .launcher-icon{width:64px; height:64px;}
  .launcher-icon svg{width:100%; height:100%;}
  .launcher-body{text-align:center;}
  .launcher-body h3{font-size:19px; margin:0 0 8px;}
  .launcher-body p{font-size:13.5px; color:var(--ink-soft); line-height:1.55; margin:0 0 20px;}
  .launcher-body code{
    background:rgba(255,255,255,0.08); color:var(--ink);
    padding:2px 6px; border-radius:5px; font-size:12.5px;
  }
  .launcher-play{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--grad); color:#07070f;
    font-weight:700; font-size:14.5px;
    padding:13px 26px; border-radius:10px;
  }

  footer{
    padding:26px clamp(16px,4vw,40px) 40px;
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;
    color:var(--ink-soft); font-size:13px;
    border-top:1px solid var(--line);
  }
  .footer-brand{font-family:'Orbitron', sans-serif; font-weight:700; color:var(--ink); letter-spacing:0.5px;}

  /* ---------- LOCK SCREEN (fake calculator) ---------- */
  #lock-screen{
    position:fixed; inset:0; z-index:200;
    display:flex; align-items:center; justify-content:center;
    background:#284e58;
    transition:opacity .5s ease;
    overflow-y:auto;
    padding:24px 16px;
  }
  #lock-screen.hidden{opacity:0; pointer-events:none;}
  #site{
    opacity:0;
    transition:opacity .6s ease;
  }
  #site.revealed{opacity:1;}

  .calc-app{
    width:min(400px, 92vw);
    max-width:100%;
    margin:auto;
  }

  .calc-header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px;
  }
  .calc-app-title{
    font-family:'Baloo 2', sans-serif;
    font-size:32px; font-weight:700;
    color:#fff;
    text-transform:lowercase;
  }
  .code-toggle-wrap{display:flex; align-items:center; gap:12px;}
  .code-toggle-label{
    font-size:12px; font-weight:700; letter-spacing:1px;
    color:#cfe0e2; text-transform:uppercase;
  }
  .code-switch{
    width:52px; height:26px; border-radius:20px;
    background:#00131e; position:relative; cursor:pointer;
    border:1px solid rgba(255,255,255,0.08);
    transition:background .2s ease;
  }
  .code-switch .knob{
    position:absolute; top:3px; left:3px;
    width:18px; height:18px; border-radius:50%;
    background:#d13f30; transition:left .2s ease;
    box-shadow:0 0 8px rgba(209,63,48,0.7);
  }
  .code-switch.on .knob{left:31px; background:#3ddc84; box-shadow:0 0 8px rgba(61,220,132,0.7);}

  .calc-display{
    background:#00131e;
    border-radius:14px;
    text-align:right;
    color:#d7d7be;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:44px;
    padding:26px 24px;
    min-height:30px;
    line-height:1;
    white-space:nowrap;
    overflow:hidden;
    margin-bottom:16px;
    transition:font-size .1s ease;
    letter-spacing:1px;
  }

  .calc-panel{
    background:#00131e;
    border-radius:18px;
    padding:20px;
  }
  .calc-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:12px;
  }
  .calc-btn{
    aspect-ratio:1/1;
    border-radius:12px;
    border:none;
    font-size:24px;
    font-weight:700;
    display:flex; align-items:center; justify-content:center;
    background:#c4c4c4;
    color:#12181c;
    cursor:pointer;
    font-family:'Inter', sans-serif;
    box-shadow:0 4px 0 rgba(0,0,0,0.28);
    transition:transform .06s ease, box-shadow .06s ease;
  }
  .calc-btn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,0.28);}
  .calc-btn.accent{background:#9e8755; color:#f4ecd8;}
  .calc-btn.danger{background:#d13f30; color:#fff;}
  .calc-btn.wide{grid-column:span 2; aspect-ratio:auto;}
  .calc-hint{
    text-align:center; font-size:12px; color:#8fd6a8;
    margin-top:14px; min-height:16px; font-weight:600;
  }
</style>
</head>
<body>

<div id="lock-screen">
  <div class="calc-app">
    <div class="calc-header">
      <div class="calc-app-title">calc</div>
      <div class="code-toggle-wrap">
        <span class="code-toggle-label">Code Mode</span>
        <div class="code-switch" id="code-switch"><div class="knob"></div></div>
      </div>
    </div>

    <div class="calc-display" id="calc-display">0</div>

    <div class="calc-panel">
      <div class="calc-grid">
        <button class="calc-btn" data-digit="7">7</button>
        <button class="calc-btn" data-digit="8">8</button>
        <button class="calc-btn" data-digit="9">9</button>
        <button class="calc-btn accent" data-action="backspace">DEL</button>

        <button class="calc-btn" data-digit="4">4</button>
        <button class="calc-btn" data-digit="5">5</button>
        <button class="calc-btn" data-digit="6">6</button>
        <button class="calc-btn" data-action="op" data-op="+">+</button>

        <button class="calc-btn" data-digit="1">1</button>
        <button class="calc-btn" data-digit="2">2</button>
        <button class="calc-btn" data-digit="3">3</button>
        <button class="calc-btn" data-action="op" data-op="−">-</button>

        <button class="calc-btn" data-action="dot">.</button>
        <button class="calc-btn" data-digit="0">0</button>
        <button class="calc-btn" data-action="op" data-op="÷">/</button>
        <button class="calc-btn" data-action="op" data-op="×">x</button>

        <button class="calc-btn accent wide" data-action="clear">RESET</button>
        <button class="calc-btn danger wide" data-action="equals">=</button>
      </div>
    </div>

    <div class="calc-hint" id="calc-hint"></div>
  </div>
</div>

let activeCat = "todos";

function renderSidebar(){
  const list = document.getElementById('cat-list');
  const items = [{id:"todos", nome:"Todos", desc:"Ver o catálogo inteiro", icon:ALL_ICON, g1:"#3d8bff", g2:"#a855f7"}, ...CATEGORIES];
  list.innerHTML = items.map(c => `
    <div class="cat-item ${c.id===activeCat?'active':''}" data-cat="${c.id}">
      <div class="cat-icon" style="background:linear-gradient(135deg, ${c.g1}, ${c.g2})">${c.icon}</div>
      <div class="cat-text"><b>${c.nome}</b><span>${c.desc}</span></div>
    </div>
  `).join('');
  list.querySelectorAll('.cat-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      activeCat = el.dataset.cat;
      renderSidebar();
      renderCatalog();
    });
  });
}

function iconBoxHTML(g){
  if(g.capa){
    return { style: `background-image:url('${g.capa}'); background-size:cover; background-position:center;`, inner: '' };
  }
  return { style: `background:linear-gradient(135deg, ${g.g1}, ${g.g2})`, inner: ICONS[g.id] };
}

function cardHTML(g){
  const box = iconBoxHTML(g);
  return `
    <div class="game-card" onclick="openGame('${g.id}')">
      <div class="game-top">
        <div class="cat-icon" style="${box.style}">${box.inner}</div>
        <div>
          <div class="game-name">${g.nome}</div>
        </div>
      </div>
      <div class="game-desc">${g.desc}</div>
      <div class="game-foot">
        <span class="details-link">Detalhes</span>
        <span class="play-round">▶</span>
      </div>
    </div>
  `;
}

function renderCatalog(){
  const wrap = document.getElementById('catalogo');
  const cats = activeCat==="todos" ? CATEGORIES : CATEGORIES.filter(c=>c.id===activeCat);

  wrap.innerHTML = cats.map(cat => {
    const games = GAMES.filter(g=>g.categoria===cat.id);
    return `
      <section style="margin-bottom:44px;">
        <div class="cat-section-head">
          <div class="cat-section-icon" style="background:linear-gradient(135deg, ${cat.g1}, ${cat.g2})">${cat.icon}</div>
          <div>
            <h3>${cat.nome}</h3>
            <span>${cat.desc}</span>
          </div>
          <div class="cat-count">${games.length} jogos</div>
        </div>
        <div class="catalog">
          ${games.map(cardHTML).join('')}
        </div>
      </section>
    `;
  }).join('');
}

function renderHero(){

/* =====================================================================
   NAVEGAÇÃO ENTRE CATÁLOGO E JOGOS
   =====================================================================
   Para plugar um jogo de verdade, registre uma função em GAME_MODULES
   com a mesma chave do id do jogo (veja a lista em GAMES). A função
   recebe o elemento <div id="game-stage"> vazio e deve desenhar o jogo
   dentro dele (canvas, DOM, etc).

   Exemplo:
   GAME_MODULES.sinuca = function(stage){
     stage.innerHTML = '<canvas id="sinuca-canvas"></canvas>';
     // ... seu código do jogo aqui, controlando #sinuca-canvas ...
   };

   Se um jogo não tiver módulo registrado, a tela mostra um placeholder
   "em construção" automaticamente.
===================================================================== */
const GAME_MODULES = {
  // sinuca: function(stage){ ... },
  // etc — adicione conforme for implementando cada jogo.

  // "Futebol" plugado com o jogo "1 on 1 Soccer" do Y8, embutido de verdade.
  futebol: function(stage){
    embedExternalGame(stage, findGame('futebol'), {
      embedUrl: 'https://www.y8.com/embed/1_on_1_soccer',
      pageUrl: 'https://pt.y8.com/games/1_on_1_soccer',
      ratio: '4/3'
    });
  },
};

/* Embute de verdade um jogo hospedado em outro site dentro da tela.
   Isso SÓ funciona quando o ProXZone está sendo servido por http(s)
   (um servidor local, GitHub Pages, Netlify, etc). Se a página estiver
   aberta direto do arquivo (file://), o navegador bloqueia esse tipo de
   iframe por segurança - nesse caso mostramos um aviso explicando como
   resolver, em vez de simplesmente falhar em silêncio. */
function embedExternalGame(stage, game, opts){
  const isFileProtocol = location.protocol === 'file:';

  if(isFileProtocol){
    stage.innerHTML = `
      <div class="launcher">
        <div class="launcher-cover" style="${game.capa
            ? `background-image:url('${game.capa}');`
            : `background:linear-gradient(135deg, ${game.g1}, ${game.g2});`}">
          ${game.capa ? '' : `<div class="launcher-icon">${ICONS[game.id]}</div>`}
        </div>
        <div class="launcher-body">
          <h3>Precisa de um servidor pra rodar aqui dentro</h3>
          <p>
            Esse jogo está aberto direto do arquivo (<code>file://</code>), e por segurança
            o navegador bloqueia esse tipo de site de ser embutido assim. Pra jogar
            dentro do ProXZone, sirva o arquivo por um servidor local ou publique
            num host como Netlify/GitHub Pages - basta abrir com <code>http://</code>
            em vez de <code>file://</code>.
          </p>
          <a class="launcher-play" href="${opts.pageUrl}" target="_blank" rel="noopener">▶ Jogar em nova aba por enquanto</a>
        </div>
      </div>
    `;
    return;
  }

  stage.innerHTML = `
    <div style="width:100%; padding:24px; display:flex; flex-direction:column; align-items:center; gap:14px;">
      <div style="position:relative; width:100%; max-width:900px; aspect-ratio:${opts.ratio}; background:#000; border-radius:12px; overflow:hidden; box-shadow:0 20px 40px -20px rgba(0,0,0,0.6);">
        <iframe
          src="${opts.embedUrl}"
          title="${game.nome}"
          loading="lazy"
          allow="autoplay; fullscreen; gamepad"
          allowfullscreen
          style="position:absolute; inset:0; width:100%; height:100%; border:0;">
        </iframe>
      </div>
      <a href="${opts.pageUrl}" target="_blank" rel="noopener" style="color:var(--blue); font-size:13px; font-weight:600;">
        Não carregou? Abra em nova aba ↗
      </a>
    </div>
  `;
}

/* Tela de "lançamento" para jogos externos sem embed (usa capa + link).
   Útil se algum jogo específico bloquear iframe mesmo servido por http. */
function externalLauncher(stage, game, externalUrl){
  const hasCover = !!game.capa;
  stage.innerHTML = `
    <div class="launcher">
      <div class="launcher-cover" style="${hasCover
          ? `background-image:url('${game.capa}');`
          : `background:linear-gradient(135deg, ${game.g1}, ${game.g2});`}">
        ${hasCover ? '' : `<div class="launcher-icon">${ICONS[game.id]}</div>`}
      </div>
      <div class="launcher-body">
        <h3>${game.nome}</h3>
        <p>${game.desc}</p>
        <a class="launcher-play" href="${externalUrl}" target="_blank" rel="noopener">▶ Jogar agora (abre em nova aba)</a>
      </div>
    </div>
  `;
}

function findGame(id){
  return GAMES.find(g => g.id === id) || null;
}

function openGame(id){
  const game = findGame(id);
  if(!game) return;

  document.getElementById('catalog-view').style.display = 'none';
  const view = document.getElementById('game-view');
  view.style.display = 'block';

  const box = iconBoxHTML(game);
  const iconEl = document.getElementById('game-view-icon');
  iconEl.setAttribute('style', box.style);
  iconEl.innerHTML = box.inner;
  document.getElementById('game-view-title').textContent = game.nome;
  document.getElementById('game-view-tag').textContent = game.desc;

  const stage = document.getElementById('game-stage');
  stage.innerHTML = '';

  if(typeof GAME_MODULES[id] === 'function'){
    GAME_MODULES[id](stage);
  } else {
    stage.innerHTML = `
      <div class="game-placeholder">
        <div class="big-icon" style="background:linear-gradient(135deg, ${game.g1}, ${game.g2})">${ICONS[game.id]}</div>
        <h3>${game.nome} em construção</h3>
        <p>Esse jogo ainda não foi implementado. Registre um módulo em <code>GAME_MODULES.${game.id}</code> no código do site para colocá-lo pra funcionar aqui.</p>
      </div>
    `;
  }

  window.scrollTo({top:0, behavior:'instant'});
  if(location.hash !== '#jogo/' + id){
    location.hash = '#jogo/' + id;
  }
}

function closeGame(){
  document.getElementById('game-view').style.display = 'none';
  document.getElementById('catalog-view').style.display = 'block';
  document.getElementById('game-stage').innerHTML = '';
  if(location.hash.startsWith('#jogo/')){
    history.replaceState(null, '', location.pathname + location.search);
  }
}

document.getElementById('game-back').addEventListener('click', closeGame);

function syncFromHash(){
  const m = location.hash.match(/^#jogo\/([a-z]+)$/);
  if(m && findGame(m[1])){
    openGame(m[1]);
  } else {
    closeGame();
  }
}
window.addEventListener('hashchange', syncFromHash);

renderSidebar();
renderCatalog();
renderHero();
syncFromHash();

/* ---------- FAKE CALCULATOR / UNLOCK ---------- */
(function(){
  const display = document.getElementById('calc-display');
  const hint = document.getElementById('calc-hint');
  const codeSwitch = document.getElementById('code-switch');
  const lockScreen = document.getElementById('lock-screen');
  const siteEl = document.getElementById('site');

  // Calculator state
  let displayValue = "0";   // what is currently shown / being typed
  let storedValue = null;   // left-hand operand waiting for the operation
  let pendingOp = null;     // "+", "−", "×", "÷"
  let awaitingNewNumber = true; // true right after an operator, "=", reset, or at start
  let hasError = false;

  // Stealth-unlock state
  let codeMode = false;
  let zeroStreak = 0;

  function fitDisplayFontSize(){
    const len = displayValue.replace("-", "").length;
    let size = 44;
    if(len > 6) size = 36;
    if(len > 9) size = 28;
    if(len > 12) size = 20;
    display.style.fontSize = size + "px";
  }

  function render(){
    display.textContent = displayValue;
    fitDisplayFontSize();
  }

  function formatNumber(num){
    if(!isFinite(num)) return "Erro";
    // avoid floating point artifacts like 0.1 + 0.2 = 0.30000000000000004
    let rounded = parseFloat(num.toPrecision(12));
    let str = rounded.toString();
    if(str.length > 14) str = rounded.toExponential(4);
    return str;
  }

  function inputDigit(d){
    if(hasError){ clearAll(); }

    if(awaitingNewNumber){
      displayValue = d;
      awaitingNewNumber = false;
      render();
      return;
    }

    // While the display is only zeros ("0", "00", "000"...), keep showing
    // every extra "0" the user types instead of collapsing it - this makes
    // typed codes like 0000 visible, exactly like a real keypad.
    if(/^0+$/.test(displayValue)){
      if(d === "0"){
        if(displayValue.length < 14) displayValue += "0";
      } else {
        displayValue = d;
      }
      render();
      return;
    }

    if(displayValue.replace("-","").replace(".","").length >= 14) return;
    displayValue += d;
    render();
  }

  function inputDot(){
    if(hasError){ clearAll(); }
    if(awaitingNewNumber){
      displayValue = "0.";
      awaitingNewNumber = false;
    } else if(!displayValue.includes(".")){
      displayValue += ".";
    }
    render();
  }

  function clearAll(){
    displayValue = "0";
    storedValue = null;
    pendingOp = null;
    awaitingNewNumber = true;
    hasError = false;
    render();
  }

  function backspace(){
    if(hasError){ clearAll(); return; }
    if(awaitingNewNumber) return;
    if(displayValue.length <= 1 || (displayValue.length === 2 && displayValue.startsWith("-"))){
      displayValue = "0";
    } else {
      displayValue = displayValue.slice(0, -1);
    }
    render();
  }

  function toggleSign(){
    if(hasError) return;
    if(displayValue !== "0"){
      displayValue = displayValue.startsWith("-") ? displayValue.slice(1) : "-" + displayValue;
    }
    render();
  }

  function percent(){
    if(hasError) return;
    displayValue = formatNumber(parseFloat(displayValue) / 100);
    render();
  }

  function compute(a, b, op){
    switch(op){
      case "+": return a + b;
      case "−": return a - b;
      case "×": return a * b;
      case "÷": return b === 0 ? Infinity : a / b;
      default: return b;
    }
  }

  function chooseOp(op){
    if(hasError) return;
    const current = parseFloat(displayValue);

    if(pendingOp !== null && !awaitingNewNumber){
      const result = compute(storedValue, current, pendingOp);
      if(!isFinite(result)){
        displayValue = "Erro";
        hasError = true;
        storedValue = null;
        pendingOp = null;
        awaitingNewNumber = true;
        render();
        return;
      }
      storedValue = result;
      displayValue = formatNumber(result);
    } else {
      storedValue = current;
    }

    pendingOp = op;
    awaitingNewNumber = true;
    render();
  }

  function evaluate(){
    if(hasError || pendingOp === null || storedValue === null) return;
    const current = parseFloat(displayValue);
    const result = compute(storedValue, current, pendingOp);

    if(!isFinite(result)){
      displayValue = "Erro";
      hasError = true;
    } else {
      displayValue = formatNumber(result);
    }

    storedValue = null;
    pendingOp = null;
    awaitingNewNumber = true;
    render();
  }

  /* ---- stealth unlock ---- */
  function tryUnlock(){
    zeroStreak++;
    if(zeroStreak >= 4){
      zeroStreak = 0;
      unlockSite();
    }
  }

  function unlockSite(){
    hint.textContent = "Acesso liberado";
    setTimeout(()=>{
      lockScreen.classList.add('hidden');
      siteEl.classList.add('revealed');
    }, 350);
  }

  codeSwitch.addEventListener('click', ()=>{
    codeMode = !codeMode;
    codeSwitch.classList.toggle('on', codeMode);
    zeroStreak = 0;
    hint.textContent = codeMode ? "Code Mode ativado" : "";
    if(codeMode){
      setTimeout(()=>{ if(codeMode) hint.textContent = ""; }, 1400);
    }
  });

  document.querySelectorAll('.calc-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const digit = btn.dataset.digit;
      const action = btn.dataset.action;

      if(digit !== undefined){
        if(codeMode){
          if(digit === "0"){ tryUnlock(); } else { zeroStreak = 0; }
        }
        inputDigit(digit);
        return;
      }

      if(codeMode) zeroStreak = 0;

      switch(action){
        case "clear": clearAll(); break;
        case "backspace": backspace(); break;
        case "sign": toggleSign(); break;
        case "percent": percent(); break;
        case "dot": inputDot(); break;
        case "op": chooseOp(btn.dataset.op); break;
        case "equals": evaluate(); break;
      }
    });
  });

  render();
})();
</script>
